PAGE_INIT.boblebomben=()=>{
  const save=()=>store.set("dypdykk-party-names",[...document.querySelectorAll(".pn")].map(i=>i.value.trim()).filter(Boolean));
  $("pAdd").onclick=()=>{ save(); const l=store.get("dypdykk-party-names")||[]; if(l.length>=8){toast("Maks 8 spillere");return;} l.push("Spiller "+(l.length+1)); store.set("dypdykk-party-names",l); route(); };
  document.querySelectorAll(".pdel").forEach(b=>b.onclick=()=>{ save(); const l=store.get("dypdykk-party-names")||[]; l.splice(+b.dataset.i,1); store.set("dypdykk-party-names",l); route(); });
  document.querySelectorAll("#pBots span").forEach(s=>s.onclick=()=>{ PARTY.bots=+s.dataset.b; save(); route(); });
  document.querySelectorAll("#pLives span").forEach(s=>s.onclick=()=>{ PARTY.lives=+s.dataset.l; save(); route(); });
  if(typeof onlineInit==="function") onlineInit();
  $("pStart").onclick=async()=>{ save(); const names=store.get("dypdykk-party-names")||[];
    const players=[...names.map(n=>({n,bot:false})),...Array.from({length:PARTY.bots},(_,i)=>({n:"Dykkebot "+(i+1),bot:true}))];
    if(players.length<2){ toast("Dere må være minst to (legg til en datamotstander)"); return; }
    if(players.every(p=>p.bot)){ toast("Minst én spiller må være et menneske"); return; }
    ac(); await datasetsReady; partyStart(players); };
};
function partyStart(players,net){
  pg={players:players.map(p=>({...p,lives:PARTY.lives,ans:0,rare:0})),turn:0,round:0,log:[],net:!!net};
  partyRound(); }
// Velger og laster et spørsmål. Neste runde hentes i bakgrunnen mens denne spilles, så det blir ingen pause mellom rundene.
async function partyPick(avoid){ const pool=partyQuestions(); let q=null;
  for(let t=0;t<8&&!q;t++){ const c=pool[Math.floor(Math.random()*pool.length)]; if(avoid&&avoid.has(c.id)&&t<6) continue; if(await ensureLoaded(c)) q=c; }
  return q||QUESTIONS.find(x=>!x.src); }
async function partyRound(){
  const mine=pg; pg.seen=pg.seen||new Set();
  const q=await (pg._next||partyPick(pg.seen)); if(pg!==mine) return; pg._next=null; pg.seen.add(q.id);
  pg._next=partyPick(pg.seen);
  parse(q); pg.q=q; pg.used=new Set(); pg.round++; pg.pressure=0; pg.fuse=100+Math.random()*200; pg.answers=[];
  while(pg.players[pg.turn].lives<=0) pg.turn=(pg.turn+1)%pg.players.length;
  partyRender(); clearInterval(pgTimer); pgTimer=setInterval(partyTick,100); partyTurnStart(); }
function partyAlive(){ return pg.players.filter(p=>p.lives>0); }
function partyRender(msg){
  const cur=pg.players[pg.turn], s=1+Math.min(pg.pressure/300,1)*.9;
  $("page").innerHTML=`<div class="pg narrow" style="text-align:center"><button class="back" id="pQuit">← Avslutt Boblebomben</button>
    <div class="kicker" style="color:var(--cyan)">Runde ${pg.round} · Boblebomben</div>
    <div class="ptitle" style="font-size:clamp(26px,6vw,40px)">${esc(pg.q.q)}</div>
    <div style="height:210px;display:grid;place-items:center"><div id="pBomb" style="width:150px;height:150px;transform:scale(${s});transition:transform .15s">${BOMB}</div></div>
    <div class="banner" style="justify-content:center;background:rgba(94,242,214,.08);border-color:rgba(94,242,214,.35);color:#dffcf6">${cur.bot?"🤖 ":cur.id?"🌐 ":""}<b>${esc(cur.n)}</b>&nbsp;har boblen${cur.bot?" … tenker":cur.id?" … skriver":""}</div>
    ${cur.bot||cur.id?"":`<form id="pForm" class="barrow glass" style="margin:0 auto 10px;max-width:520px" autocomplete="off"><input id="pInp" class="field" style="border:0;background:transparent;font-size:18px" placeholder="Skriv et svar …" autocapitalize="off" spellcheck="false"><button id="go" type="submit">SEND ▶</button></form>`}
    <div id="pMsg" style="min-height:24px;font-size:14px;color:#ffc2ba">${msg||""}</div>
    <div class="panel glass" style="text-align:left"><h3>Spillere</h3><ul class="lb">${pg.players.map((p,i)=>`<li style="${i===pg.turn?"background:rgba(94,242,214,.08)":""}${p.lives<=0?";opacity:.35":""}"><span class="pos">${i===pg.turn?"▶":""}</span><span class="nm">${esc(p.n)}</span><span class="sc" style="color:#ff7a6b">${p.gone?"frakoblet":"♥".repeat(Math.max(0,p.lives))||"ute"}</span><span class="sc">${p.ans} svar</span></li>`).join("")}</ul></div>
    <div class="panel glass" style="text-align:left"><h3>Brukt denne runden (${pg.answers.length})</h3><div class="chips" style="justify-content:flex-start">${pg.answers.slice(-30).map(a=>`<span class="chip" style="border-color:${TIERS[a.tier].color}66;color:${TIERS[a.tier].color}">${esc(a.label)}</span>`).join("")||'<span style="color:var(--muted);font-size:13px">Ingen ennå</span>'}</div></div></div>`;
  $("pQuit").onclick=()=>{ clearInterval(pgTimer); if(pg&&pg.net) NET.close(); pg=null; location.hash="boblebomben"; route(); };
  if(pg.net) NET.state(msg);
  if($("pForm")){ const inp=$("pInp"); setTimeout(()=>inp.focus(),30);
    $("pForm").onsubmit=e=>{ e.preventDefault(); partySubmit(inp.value); }; }
}
function partyTick(){ if(!pg) return clearInterval(pgTimer); pg.pressure+=1; const b=$("pBomb");
  if(b) b.style.transform=`scale(${1+Math.min(pg.pressure/300,1)*.9}) rotate(${Math.sin(pg.pressure/3)*(pg.pressure/pg.fuse)*6}deg)`;
  if(pg.net&&pg.pressure%3===0) NET.all({t:"p",p:pg.pressure,w:Math.round(pg.pressure/pg.fuse*100)/100});
  if(pg.pressure>=pg.fuse) partyPop(); }
// «from» er nettverks-ID-en til en spiller i en online-lobby (tom for spillere på denne enheten og boter)
function partySubmit(v,from){ if(!pg) return; v=(v||"").trim(); if(!v) return;
  const r=check(pg.q,v), cur=pg.players[pg.turn];
  if((from||null)!==(cur.id||null)) return;   // bare den som har boblen kan svare
  const say=m=>{ if(from) NET.to(from,{t:"msg",m}); else { SFX.wrong(); partyMsg(m); } };
  if(!r) return say(`«${esc(v)}» ble ikke godkjent`);
  if(!r.exact&&SET.corr!==false) return say(`Mente du «${esc(r.a.label)}»? Skriv det, så teller det.`);
  if(pg.used.has(r.a)) return say(`«${esc(r.a.label)}» er allerede brukt`);
  pg.used.add(r.a); pg.answers.push(r.a); cur.ans++; if(r.a.tier>=4) cur.rare++;
  pg.pressure=Math.max(0,pg.pressure-(10+r.a.tier*9)); SFX.tier(r.a.tier);
  partyNext(); }
function partyMsg(m){ const el=$("pMsg"); if(el){ el.innerHTML=m; const f=$("pForm"); if(f){f.classList.remove("err");void f.offsetWidth;f.classList.add("err");} const i=$("pInp"); if(i){i.value="";i.focus();} } }
function partyNext(){ do{ pg.turn=(pg.turn+1)%pg.players.length; }while(pg.players[pg.turn].lives<=0); partyRender(); partyTurnStart(); }
function partyTurnStart(){ const cur=pg.players[pg.turn]; if(!cur.bot) return;
  const r0=pg.round, t0=pg.turn, delay=1200+Math.random()*2800;
  setTimeout(()=>{ if(!pg||pg.round!==r0||pg.turn!==t0) return;
    const all=parse(pg.q).filter(a=>!pg.used.has(a)); if(!all.length||Math.random()<.06) return;   // boten står fast av og til
    const w=all.map(a=>Math.pow(.45,a.tier)); let x=Math.random()*w.reduce((s,v)=>s+v,0), pick=all[0];
    for(let i=0;i<all.length;i++){ x-=w[i]; if(x<=0){ pick=all[i]; break; } }
    partySubmit(pick.label); },delay); }
function partyPop(){ clearInterval(pgTimer); const cur=pg.players[pg.turn]; cur.lives--; SFX.boom(); fx.flash("#ff7a6b",.6,700); fx.shake(14,600);
  if(pg.net) NET.all({t:"pop",n:cur.n});
  const alive=partyAlive();
  const box=$("page").querySelector(".pg"); if(box) box.insertAdjacentHTML("afterbegin",`<div class="banner" style="justify-content:center;font-size:16px">💥 Boblen sprakk hos <b>&nbsp;${esc(cur.n)}</b>!</div>`);
  setTimeout(()=>{ if(!pg) return; if(alive.length<=1) partyEnd(alive[0]); else { pg.turn=(pg.turn+1)%pg.players.length; partyRound(); } },1800); }
function partyEnd(winner){ const ps=[...pg.players].sort((a,b)=>b.lives-a.lives||b.ans-a.ans);
  $("page").innerHTML=`<div class="pg narrow" style="text-align:center"><div class="kicker" style="color:var(--cyan)">Boblebomben ferdig etter ${pg.round} runder</div>
    <div class="ptitle">🏆 ${esc(winner?winner.n:"Ingen")} vant!</div>
    <div class="panel glass" style="text-align:left"><h3>Resultat</h3><ul class="lb">${ps.map((p,i)=>`<li><span class="pos">${i+1}</span><span class="nm">${esc(p.n)}</span><span class="sc">${p.ans} svar</span><span class="sc" style="color:#ffd36b">${p.rare} sjeldne</span></li>`).join("")}</ul></div>
    <div class="btnrow"><button class="btn btn-primary" id="pAgain">Spill igjen</button><button class="btn btn-ghost" id="pBack">Til oppsett</button></div></div>`;
  SFX.tier(5); const players=pg.players.filter(p=>!p.gone).map(p=>({n:p.n,bot:p.bot,id:p.id}));
  if(pg.net) NET.all({t:"end",w:winner?winner.n:"Ingen",round:pg.round,rows:ps.map(p=>[p.n,p.ans,p.rare])});
  const net=pg.net;
  $("pAgain").onclick=()=>{ if(net&&!NET.peer){ toast("Lobbyen er stengt"); return; } partyStart(players,net); };
  if(net){ $("pBack").textContent="Til lobbyen"; $("pAgain").insertAdjacentHTML("afterend",'<button class="btn btn-ghost" id="pClose">Steng lobbyen</button>');
    $("pClose").onclick=()=>{ NET.close(); pg=null; route(); }; }
  $("pBack").onclick=()=>{ pg=null; if(net&&NET.peer) return netLobbySync(), netLobbyRender(); route(); }; }

/* ---------- Boblebomben over nettet: lobby med kode ----------
   Verten (den som lager lobbyen) kjører spillet og sjekker alle svar. De andre kobles direkte til verten
   (WebRTC via PeerJS) og sender bare inn svar. Ingen egen server eller lagring trengs. */
const NET={peer:null,conns:new Map(),host:false,code:"",hostConn:null,me:"",lobby:[],
  all(m){ for(const c of this.conns.values()) if(c.open) c.send(m); },
  to(id,m){ const c=this.conns.get(id); if(c&&c.open) c.send(m); },
  state(msg){ if(!pg) return; const cur=pg.players[pg.turn];
    this.all({t:"state",q:pg.q.q,round:pg.round,turn:pg.turn,turnId:cur.id||"",msg:msg||"",p:pg.pressure,
      players:pg.players.map(p=>({n:p.n,lives:p.lives,ans:p.ans,bot:!!p.bot,gone:!!p.gone,id:p.id||""})),
      answers:pg.answers.slice(-30).map(a=>[a.label,a.tier]),count:pg.answers.length}); },
  close(){ try{ this.all({t:"bye"}); }catch(e){} try{ this.peer&&this.peer.destroy(); }catch(e){}
    this.peer=null; this.conns.clear(); this.host=false; this.hostConn=null; this.lobby=[]; }
};
const NET_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789", NET_PREFIX="dypdykk-boble-";
function netCode(){ let s=""; for(let i=0;i<5;i++) s+=NET_ABC[Math.floor(Math.random()*NET_ABC.length)]; return s; }
let _peerLib=null;
function loadPeer(){ return _peerLib||(_peerLib=new Promise((ok,bad)=>{ if(window.Peer) return ok();
  const s=document.createElement("script"); s.src="peerjs.min.js"; s.onload=()=>ok(); s.onerror=()=>{ _peerLib=null; bad(new Error("lib")); };
  document.head.appendChild(s); })); }
function netErr(e){ const t=(e&&e.type)||"";
  return t==="peer-unavailable"?"Fant ingen lobby med den koden. Sjekk koden og at verten fortsatt har lobbyen åpen."
    :t==="unavailable-id"?"Koden var opptatt – prøv igjen."
    :t==="network"||t==="server-error"||t==="socket-error"?"Fikk ikke kontakt med koblingstjenesten. Sjekk nettet og prøv igjen."
    :t==="browser-incompatible"?"Nettleseren støtter ikke direkte tilkobling."
    :"Tilkoblingen feilet. Noen nettverk (f.eks. strenge bedriftsnett) stopper direkte tilkobling."; }

  return `<div class="panel glass full" id="netPanel"><h3>🌐 Spill over nettet</h3>
    <p class="psub" style="font-size:14px;margin:0 0 12px">Lag en lobby og del koden med vennene dine. De blir med fra sin egen mobil eller PC.</p>
    <div class="rowf" style="margin-bottom:10px"><input class="field" id="netName" maxlength="16" placeholder="Ditt navn" value="${esc(myName()||store.get("dypdykk-net-name")||"")}"></div>
    <div class="rowf" style="gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" id="netHost" style="flex:1;min-width:160px">Lag lobby</button>
      <input class="field" id="netCode" maxlength="5" placeholder="KODE" value="${esc(code.toUpperCase())}" style="flex:1;min-width:110px;text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:700" autocapitalize="characters" autocomplete="off" spellcheck="false">

function onlineInit(){ const nm=()=>{ const v=($("netName").value||"").trim().slice(0,16); if(v) store.set("dypdykk-net-name",v); return v; };
  $("netHost").onclick=()=>{ const n=nm(); if(!n) return netSay("Skriv navnet ditt først"); netHostStart(n); };
  $("netJoin").onclick=()=>{ const n=nm(), c=($("netCode").value||"").trim().toUpperCase();
    if(!n) return netSay("Skriv navnet ditt først"); if(!/^[A-Z0-9]{5}$/.test(c)) return netSay("Koden har 5 tegn"); netJoin(c,n); };
  if(new URLSearchParams(location.search).get("bli")) setTimeout(()=>$("netName")&&$("netName").focus(),100); }
function netSay(m){ const e=$("netMsg"); if(e) e.textContent=m; else toast(m); }

/* ----- Vert ----- */
async function netHostStart(name,tries){ netSay("Lager lobby …");
  try{ await loadPeer(); }catch(e){ return netSay("Kunne ikke laste tilkoblingsmodulen. Sjekk nettet."); }
  NET.close(); const code=netCode(); const peer=new Peer(NET_PREFIX+code,Object.assign({debug:0},window.DYPDYKK_PEER||{}));
  NET.peer=peer; NET.host=true; NET.code=code; NET.lobby=[{n:name,id:""}];
  peer.on("open",()=>{ ac(); netLobbyRender(); });
  peer.on("error",e=>{ if(e.type==="unavailable-id"&&(tries||0)<3) return netHostStart(name,(tries||0)+1);
    if(e.type==="peer-unavailable") return; netSay(netErr(e)); if(!NET.lobby.length||!$("netLobby")) return; toast(netErr(e)); });
  peer.on("disconnected",()=>{ try{ peer.reconnect(); }catch(e){} });   // mister bare koblingstjenesten; spillere er fortsatt tilkoblet
  peer.on("connection",conn=>{
    conn.on("open",()=>{ const n=String((conn.metadata&&conn.metadata.n)||"Gjest").slice(0,16);
      if(pg){ conn.send({t:"full",m:"Spillet er allerede i gang. Vent til neste runde."}); setTimeout(()=>conn.close(),500); return; }
      if(NET.lobby.length>=8){ conn.send({t:"full",m:"Lobbyen er full (8 spillere)."}); setTimeout(()=>conn.close(),500); return; }
      let nn=n, k=2; while(NET.lobby.some(p=>p.n.toLowerCase()===nn.toLowerCase())) nn=n.slice(0,13)+" "+(k++);
      NET.conns.set(conn.peer,conn); NET.lobby.push({n:nn,id:conn.peer}); SFX.bubble&&SFX.bubble(); netLobbySync(); });
    conn.on("data",d=>netHostData(conn.peer,d));
    conn.on("close",()=>netGone(conn.peer)); conn.on("error",()=>netGone(conn.peer)); }); }
function netGone(id){ if(!NET.conns.has(id)) return; NET.conns.delete(id);
  const i=NET.lobby.findIndex(p=>p.id===id); const who=i>=0?NET.lobby[i].n:"En spiller"; if(i>=0) NET.lobby.splice(i,1);
  if(pg&&pg.net&&!$("pAgain")){ const p=pg.players.find(x=>x.id===id); if(p&&!p.gone){ p.gone=true; p.lives=0; toast(`${p.n} forlot spillet`);
      const alive=partyAlive(); if(alive.length<=1){ clearInterval(pgTimer); partyEnd(alive[0]); }
      else if(pg.players[pg.turn]===p) partyNext(); else partyRender(); } }
  else if(!pg) netLobbySync(); }
function netHostData(id,d){ if(!d||typeof d!=="object") return;
  if(d.t==="ans"&&pg&&pg.net) partySubmit(String(d.v||"").slice(0,80),id); }
function netLobbySync(){ NET.all({t:"lobby",code:NET.code,players:NET.lobby.map(p=>p.n),lives:PARTY.lives,bots:PARTY.bots}); if($("netLobby")) netLobbyRender(); }
function netLobbyRender(){ if(pg) return; const link=location.origin+location.pathname+"?bli="+NET.code+"#boblebomben";
  $("page").innerHTML=`<div class="pg narrow" style="text-align:center" id="netLobby"><button class="back" id="nlQuit">← Steng lobbyen</button>
    <div class="kicker" style="color:var(--cyan)">Boblebomben · lobby</div>
    <div class="ptitle" style="font-size:clamp(20px,5vw,28px)">Del koden med vennene dine</div>
    <div style="font-size:clamp(46px,14vw,76px);font-weight:800;line-height:1.1;letter-spacing:.18em;margin:10px 0 8px;color:#dffcf6;text-shadow:0 0 30px rgba(94,242,214,.45)">${NET.code}</div>
    <div class="btnrow" style="margin-bottom:14px"><button class="btn btn-ghost" id="nlCopy">Kopier invitasjonslenke</button></div>
    <div class="panel glass" style="text-align:left"><h3>Spillere (${NET.lobby.length + PARTY.bots})</h3><ul class="lb">
      ${NET.lobby.map((p,i)=>`<li><span class="pos">${i?"🌐":"👑"}</span><span class="nm">${esc(p.n)}</span><span class="sc">${i?"tilkoblet":"vert"}</span></li>`).join("")}
      ${Array.from({length:PARTY.bots},(_,i)=>`<li><span class="pos">🤖</span><span class="nm">Dykkebot ${i+1}</span><span class="sc">datamotstander</span></li>`).join("")}</ul>
      ${NET.lobby.length<2?'<p class="psub" style="font-size:13px;margin:8px 0 0">Venter på at noen blir med …</p>':""}</div>
    <div class="panel glass" style="text-align:left"><h3>Oppsett</h3>
      <div class="sect" style="text-align:left;margin-top:0">Datamotstandere</div><div class="chipsel" id="nlBots">${[0,1,2,3].map(n=>`<span data-b="${n}" class="${n===PARTY.bots?"on":""}" style="cursor:pointer">${n}</span>`).join("")}</div>
      <div class="sect" style="text-align:left">Liv per spiller</div><div class="chipsel" id="nlLives">${[1,2,3,5].map(n=>`<span data-l="${n}" class="${n===PARTY.lives?"on":""}" style="cursor:pointer">${n}</span>`).join("")}</div></div>
    <button class="btn btn-primary" id="nlStart" style="width:100%;max-width:420px">Start spillet</button></div>`;

/* ----- Boblefiguren (egen design: en såpeboble med ansikt som sprekker opp) ----- */
function bbBubbleSVG(p,mood){ p=Math.max(0,Math.min(1,p)); const r=34+p*30, cheek=Math.max(0,(p-.55)/.45), cracks=Math.max(0,(p-.72)/.28), sweat=p>.6;
  const eyeY=78-p*2, worry=p>.7, sleep=mood==="sleep", happy=mood==="happy";
  const crack=(a,l)=>{ const x=80+Math.cos(a)*r*.92, y=86+Math.sin(a)*r*.92, x2=80+Math.cos(a+.15)*(r*.92-l), y2=86+Math.sin(a+.15)*(r*.92-l), x3=80+Math.cos(a-.08)*(r*.92-l*1.6), y3=86+Math.sin(a-.08)*(r*.92-l*1.6);
    return `<polyline points="${x},${y} ${x2},${y2} ${x3},${y3}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="${cracks}"/>`; };
  return `<svg viewBox="0 0 160 160" class="bbsvg"><defs><radialGradient id="bbg" cx=".36" cy=".32"><stop offset="0" stop-color="#e6fdff"/><stop offset=".5" stop-color="${p>.75?"#ffb3c7":"#7fd8f2"}"/><stop offset="1" stop-color="${p>.75?"#c2375e":"#1d6b96"}"/></radialGradient>
    <radialGradient id="bbglow"><stop offset="0" stop-color="${p>.75?"#ff5d7a":"#5ef2d6"}" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
    <circle cx="80" cy="86" r="${r+18}" fill="url(#bbglow)" opacity="${.25+p*.75}"/>
    <ellipse cx="80" cy="${86+r+10}" rx="${r*.7}" ry="5" fill="#000" opacity=".22"/>
    <circle cx="80" cy="86" r="${r}" fill="url(#bbg)" opacity=".93" stroke="#dffcff" stroke-opacity=".5" stroke-width="2"/>
    <ellipse cx="${80-r*.38}" cy="${86-r*.42}" rx="${r*.26}" ry="${r*.15}" fill="#fff" opacity=".6" transform="rotate(-32 ${80-r*.38} ${86-r*.42})"/>
    <circle cx="${80+r*.42}" cy="${86-r*.5}" r="${r*.06}" fill="#fff" opacity=".7"/>
    ${[0.4,1.3,2.4,3.6,4.7,5.6].map((a,i)=>crack(a+i*.2,8+p*10)).join("")}
    ${sleep?`<path d="M64 ${eyeY} q6 4 12 0 M84 ${eyeY} q6 4 12 0" stroke="#0b2b40" stroke-width="3" fill="none" stroke-linecap="round"/>`
      :happy?`<path d="M64 ${eyeY+2} q6 -6 12 0 M84 ${eyeY+2} q6 -6 12 0" stroke="#0b2b40" stroke-width="3" fill="none" stroke-linecap="round"/>`
      :`<circle cx="70" cy="${eyeY}" r="${4+p*2}" fill="#0b2b40"/><circle cx="90" cy="${eyeY}" r="${4+p*2}" fill="#0b2b40"/><circle cx="71.5" cy="${eyeY-1.5}" r="1.4" fill="#fff"/><circle cx="91.5" cy="${eyeY-1.5}" r="1.4" fill="#fff"/>
        ${worry?`<path d="M62 ${eyeY-10} l12 4 M98 ${eyeY-10} l-12 4" stroke="#0b2b40" stroke-width="2.4" stroke-linecap="round"/>`:""}`}
    <ellipse cx="62" cy="${eyeY+11}" rx="7" ry="4" fill="#ff5d7a" opacity="${cheek*.8}"/><ellipse cx="98" cy="${eyeY+11}" rx="7" ry="4" fill="#ff5d7a" opacity="${cheek*.8}"/>
    ${sleep?`<path d="M74 ${eyeY+14} q6 3 12 0" stroke="#0b2b40" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
      :p>.7?`<ellipse cx="80" cy="${eyeY+16}" rx="${5+p*3}" ry="${3+p*4}" fill="#0b2b40"/>`:`<path d="M72 ${eyeY+13} q8 ${happy?9:6} 16 0" stroke="#0b2b40" stroke-width="2.6" fill="none" stroke-linecap="round"/>`}
    ${sweat?`<path d="M${80+r*.7} ${86-r*.35} q4 7 0 10 q-4 -3 0 -10z" fill="#bff3ff" opacity="${cheek}"/>`:""}
    ${sleep?`<text x="112" y="44" font-size="14" fill="#bff3ff" opacity=".8" font-family="monospace">z z z</text>`:""}
  </svg>`; }

/* ----- Tilstand og motor (bare verten/den lokale enheten kjører motoren) ----- */
let BB=null, bbTimer=null, bbAnim=null, bbEvSeen=0, bbMe="", bbLocalTyping="";
function bbNewState(players,settings,net){ return {net:!!net,set:{...settings},phase:"ready",round:0,cat:0,turn:0,q:null,qText:"",used:[],answers:[],
  players:players.map((p,i)=>({id:p.id||("p"+i),n:p.n,bot:!!p.bot,local:!!p.local,lives:settings.lives,pts:0,segs:[],ans:0,rare:0,out:false,gone:false,last:null,typing:""})),
  catStart:0,fuseAt:0,turnStart:0,pressure:0,ev:[],evn:0,countdown:3,winner:null}; }
function bbEv(e){ BB.evn++; e.eid=BB.evn; BB.ev.push(e); if(BB.ev.length>20) BB.ev.shift(); }
function bbAlive(){ return BB.players.filter(p=>!p.out); }
function bbCur(){ return BB.players[BB.turn]; }
function bbNextTurn(from){ const n=BB.players.length; let i=from; for(let k=0;k<n;k++){ i=(i+1)%n; if(!BB.players[i].out) return i; } return from; }

async function bbStart(players,settings,net){
  clearInterval(bbTimer); BB=bbNewState(players,settings,net); BB._seen=new Set(); bbEvSeen=0;
  BB._next=partyPick(BB._seen);
  bbRenderArena(); bbEv({k:"ready"}); bbSync();
  for(let n=3;n>=1;n--){ BB.countdown=n; bbEv({k:"count",n}); bbSync(); await new Promise(r=>setTimeout(r,800)); if(!BB) return; }
  BB.countdown=0; bbEv({k:"count",n:0}); BB.turn=Math.floor(Math.random()*BB.players.length); await bbNewCategory();
  bbTimer=setInterval(bbTick,100); }
async function bbNewCategory(){ const mine=BB; const q=await (BB._next||partyPick(BB._seen)); if(BB!==mine) return;
  BB._seen.add(q.id); BB._next=partyPick(BB._seen); parse(q);
  BB.q=q; BB.qText=q.q; BB.cat++; BB.used=[]; BB.answers=[]; BB.players.forEach(p=>{p.last=null;p.typing="";});
  const now=Date.now(), fuse=(14+Math.random()*26)*1000;           // skjult lunte: 14–40 s per kategori
  BB.catStart=now; BB.fuseAt=now+fuse; BB.turnStart=now; BB.phase="play"; BB.pressure=0;
  if(bbCur().out) BB.turn=bbNextTurn(BB.turn);
  bbEv({k:"cat",n:BB.cat}); bbTurnStart(); bbSync(); }
function bbTurnStart(){ BB.turnStart=Date.now(); const cur=bbCur(); cur.typing=""; bbEv({k:"turn",id:cur.id}); if(cur.bot) bbBotPlay(); }
function bbTick(){ if(!BB||BB.phase!=="play") return; const now=Date.now();
  BB.pressure=Math.min(1,(now-BB.catStart)/(BB.fuseAt-BB.catStart));
  const minLeft=BB.set.minTurn*1000-(now-BB.turnStart);
  if(now>=BB.fuseAt&&minLeft<=0) return bbPop();
  if(now>=BB.fuseAt) BB.pressure=1;
  bbSync(true); }
function bbPop(){ const cur=bbCur(); BB.phase="pop"; cur.lives--; cur.typing=""; if(cur.lives<=0) cur.out=true;
  bbEv({k:"pop",id:cur.id,out:cur.out}); bbSync();
  setTimeout(async()=>{ if(!BB) return; const alive=bbAlive();
    if(alive.length<=1){ BB.phase="end"; BB.winner=alive[0]?alive[0].id:null; bbEv({k:"end",id:BB.winner}); bbSync(); clearInterval(bbTimer); return; }
    BB.turn=bbNextTurn(BB.turn); await bbNewCategory(); },2200); }
// Et svar fra en spiller. «from» er spillerens id (for online og boter).
function bbSubmit(v,from){ if(!BB||BB.phase!=="play") return; v=String(v||"").trim().slice(0,60); if(!v) return;
  const cur=bbCur(); if(from!==cur.id) return;
  const r=check(BB.q,v), say=m=>{ cur.last={bad:true,msg:m,label:v}; bbEv({k:"bad",id:cur.id,msg:m}); bbSync(); };
  if(!r) return say(`«${v}» ble ikke godkjent`);
  // Små skrivefeil (én bokstav i et langt ord) godtas direkte – her går det fort. Ellers: «Mente du …?», og Enter én gang til bekrefter.
  if(!r.exact&&SET.corr!==false&&!autoOK(r,v)){
    const key=norm(v); if(cur._pend!==key){ cur._pend=key; cur.last={bad:true,sug:true,t:Date.now(),msg:`Mente du dette: «${r.a.label}»? Enter = ja`,label:v}; bbEv({k:"sug",id:cur.id,label:r.a.label}); bbSync(); return; } }
  cur._pend=null;
  if(BB.used.includes(r.a.label)) return say(`«${r.a.label}» er allerede sagt`);
  const t=r.a.tier; BB.used.push(r.a.label); BB.answers.push([r.a.label,t,cur.n]);
  cur.last={label:r.a.label,tier:t}; cur.typing=""; cur.ans++; if(t>=4) cur.rare++;
  cur.pts+=TIERS[t].pts; cur.segs.push(t); if(cur.segs.length>12) cur.segs.shift();
  let gained=false; while(cur.pts>=BB.set.pph){ if(cur.lives<BB.set.cap){ cur.lives++; cur.pts-=BB.set.pph; gained=true; cur.segs=[]; } else { cur.pts=BB.set.pph; break; } }
  BB.fuseAt+= [0,400,800,1300,1900,2600][t];                       // sjeldne svar slipper ut litt luft
  bbEv({k:"ok",id:cur.id,label:r.a.label,tier:t}); if(gained) bbEv({k:"plus",id:cur.id});
  BB.turn=bbNextTurn(BB.turn); bbTurnStart(); bbSync(); }
function bbTyping(v,from){ if(!BB||BB.phase!=="play") return; const cur=bbCur(); if(from!==cur.id) return; cur.typing=String(v||"").slice(0,40); bbSync(true); }
function bbBotPlay(){ const r0=BB.cat, id=bbCur().id, all=parse(BB.q).filter(a=>!BB.used.includes(a.label));
  const fail=Math.random()<.08||!all.length; const w=all.map(a=>Math.pow(.45,a.tier)); let x=Math.random()*w.reduce((s,v)=>s+v,0), pick=all[0];
  for(let i=0;i<all.length;i++){ x-=w[i]; if(x<=0){ pick=all[i]; break; } }
  const word=pick?pick.label:"", think=900+Math.random()*2600; let i=0;
  const step=()=>{ if(!BB||BB.cat!==r0||bbCur().id!==id||BB.phase!=="play") return;
    if(fail) return;                                                // boten står fast av og til
    i++; bbTyping(word.slice(0,i),id); if(i<word.length) setTimeout(step,70+Math.random()*90); else setTimeout(()=>bbSubmit(word,id),250); };
  setTimeout(step,think); }

/* ----- Synk til gjester og tegning ----- */
let bbSyncT=0;
function bbPublic(){ return {set:BB.set,phase:BB.phase,cat:BB.cat,turn:BB.turn,qText:BB.qText,answers:BB.answers.slice(-30),pressure:BB.pressure,countdown:BB.countdown,winner:BB.winner,
  minLeft:Math.max(0,BB.set.minTurn*1000-(Date.now()-BB.turnStart)),ev:BB.ev,evn:BB.evn,
  players:BB.players.map(p=>({id:p.id,n:p.n,bot:p.bot,local:p.local,lives:p.lives,pts:p.pts,segs:p.segs,ans:p.ans,rare:p.rare,out:p.out,gone:p.gone,last:p.last,typing:p.typing}))}; }
function bbSync(light){ if(!BB) return; const s=bbPublic(); bbDraw(s);
  if(BB.net&&NET.peer){ const now=Date.now(); if(!light||now-bbSyncT>140){ bbSyncT=now; NET.all({t:"bb",s}); } } }

(function(){ const st=document.createElement("style"); st.textContent=BB_CSS; document.head.appendChild(st); })();

function bbSeatPos(i,n){ const a=Math.PI/2+i*2*Math.PI/n, m=innerWidth<640; return {x:50+Math.cos(a)*(m?38:40), y:(m?60:57)+Math.sin(a)*(m?27:31)}; }   // prosent; spiller 0 nederst
function bbAvatar(p,i){ const b=BUDDIES[i%BUDDIES.length]; return p.bot?ICONS[(i+2)%6]:b.art(); }
let bbLast=null; const bbChg={};
// Svarboblen «popper inn» i 350 ms når et nytt svar kommer
function bbChanged(pl){ const key=pl.last?pl.last.label+"|"+pl.last.tier:""; const c=bbChg[pl.id]; if(!c||c.key!==key){ bbChg[pl.id]={key,t:Date.now()}; return !!key&&!!c; } return Date.now()-c.t<350; }
function bbRenderArena(){ document.body.classList.add("bbplay");
  $("page").innerHTML=`<div class="pg" style="max-width:1000px;padding-bottom:150px"><button class="back" id="bbQuit">← Avslutt Boblebomben</button>
    <div class="bbarena" id="bbArena"><div class="bbring"></div><div class="bbcat" id="bbCat" style="display:none"></div><div id="bbSeats"></div>
      <div class="bbbubble" id="bbBubble"></div><div id="bbFx"></div><div class="bbcount" id="bbCount" style="display:none"></div><div class="bbwin" id="bbWin" style="display:none"></div></div>
    <div id="bbAfter"></div></div>
    <div class="bbvig" id="bbVig"></div>
    <div class="bbbar" id="bbBar"><div class="bbhint" id="bbHint"></div><div class="bbfb" id="bbFb" role="status" aria-live="polite"></div><div class="in"><div class="bbheart" id="bbHeart"></div>
      <form id="bbForm" autocomplete="off"><input id="bbInp" placeholder="Vent på boblen …" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"><button id="bbGo">SEND</button></form></div>
      <div class="bbtime"><i id="bbTime" style="width:0"></i></div></div>`;
  bbLast=null;
  $("bbQuit").onclick=()=>{ bbStop(true); location.hash="boblebomben"; route(); };
  const inp=$("bbInp");
  inp.oninput=()=>{ BBS.type(); bbLocalTyping=inp.value; bbSendTyping(inp.value); };
  // Send-knappen skal ikke stjele fokus (ellers lukkes tastaturet på mobil)
  $("bbGo").addEventListener("pointerdown",e=>e.preventDefault());
  $("bbForm").onsubmit=e=>{ e.preventDefault(); const s=bbLast; if(!s) return; const v=inp.value.trim();
    const cur=s.players[s.turn], mine=s.phase==="play"&&bbMeIds(s).includes(cur.id);
    if(!v){ if(mine&&bbSugFor){ bbSugFor=null; bbFb("Sender …",""); bbSendAnswer(bbSent); } return; }   // tom Enter = «ja» til forslaget
    if(!mine){ bbFb(s.phase==="play"?`Vent – ${esc(cur.n)} har boblen. Svaret ditt står klart.`:"Vent til boblen starter","wait"); return; }
    bbSent=v; bbSugFor=null; inp.value=""; bbLocalTyping=""; bbFb(`Sender «${esc(v)}» …`,""); bbSendAnswer(v); };
}
// Tilbakemelding rett over svarfeltet – der øynene er når det går fort
let bbSent="", bbSugFor=null, bbFbT=0;
function bbFb(html,cls,ms){ const el=$("bbFb"); if(!el) return; clearTimeout(bbFbT); el.className="bbfb on "+(cls||""); el.innerHTML=html;
  if(cls==="sug") el.onclick=()=>{ const s=bbLast; if(!s||!bbSugFor) return; bbSugFor=null; bbFb("Sender …",""); bbSendAnswer(bbSent); $("bbInp").focus(); }; else el.onclick=null;
  if(ms!==0) bbFbT=setTimeout(()=>{ el.className="bbfb"; },ms||2200); 
}
function bbMeIds(s){ if(BB&&!BB.net) return s.players.filter(p=>p.local).map(p=>p.id); return [bbMe]; }
function bbSendAnswer(v){ const s=bbLast; if(!s) return; const cur=s.players[s.turn]; if(!bbMeIds(s).includes(cur.id)) return;
  if(BB) bbSubmit(v,cur.id); else if(NET.hostConn) NET.hostConn.send({t:"ans",v}); }
let bbTypT=0;
function bbSendTyping(v){ const s=bbLast; if(!s) return; const cur=s.players[s.turn]; if(!bbMeIds(s).includes(cur.id)) return;
  if(BB) bbTyping(v,cur.id); else if(NET.hostConn&&Date.now()-bbTypT>90){ bbTypT=Date.now(); NET.hostConn.send({t:"typ",v}); } }

function bbFxAt(id,html,cls,ms){ const seat=document.querySelector(`[data-pid="${CSS.escape(id)}"]`), fxl=$("bbFx"); if(!seat||!fxl) return;
  const el=document.createElement("div"); el.className=cls; el.innerHTML=html; el.style.left=seat.style.left; el.style.top=seat.style.top; fxl.appendChild(el); setTimeout(()=>el.remove(),ms||1200); return el; }
function bbShards(){ const b=$("bbBubble"), fxl=$("bbFx"); if(!b||!fxl) return; const x=b.style.left, y=b.style.top;
  for(let i=0;i<22;i++){ const s=document.createElement("div"); s.className="bbshard"; s.style.left=x; s.style.top=y; s.style.background=["#ffd36b","#bff3ff","#ff5d7a","#5ef2d6"][i%4]; fxl.appendChild(s);
    const a=i/22*Math.PI*2, d=90+Math.random()*90; s.animate([{transform:`translate(-50%,-50%) rotate(${a}rad)`,opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) rotate(${a+3}rad)`,opacity:0}],{duration:900+Math.random()*400,easing:"cubic-bezier(.1,.8,.3,1)"}); setTimeout(()=>s.remove(),1400); } }
function bbEffects(s){ for(const e of s.ev){ if(e.eid<=bbEvSeen) continue; bbEvSeen=e.eid;
    if(e.k==="count"){ BBS.count(e.n); }
    else if(e.k==="cat"){ SFX.go(); { const i=$("bbInp"); if(i) i.value=""; bbSugFor=null; const f=$("bbFb"); if(f) f.className="bbfb"; } const c=$("bbCat"); if(c) c.animate([{transform:"translateX(-50%) translateY(-20px)",opacity:0},{transform:"translateX(-50%)",opacity:1}],{duration:450,easing:"ease-out"}); }
    else if(e.k==="ok"){ BBS.ok(e.tier); if(bbMeIds(s).includes(e.id)){ bbSugFor=null; bbFb(`✓ ${esc(e.label)} <span style="color:${TIERS[e.tier].color}">${TIERS[e.tier].name}</span> – boblen gikk videre`,"ok"); } if(e.tier>=4){ fx.flash(TIERS[e.tier].color,.18,450); } }
    else if(e.k==="bad"){ if(bbMeIds(s).includes(e.id)){ BBS.bad(); const f=$("bbForm"); if(f) f.animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(-5px)"},{transform:"none"}],{duration:300}); bbSugFor=null; bbFb(`✗ ${esc(e.msg||"Ikke godkjent")} – prøv et annet`,"bad"); } }
    else if(e.k==="pop"){ BBS.pop(); fx.flash("#ff5d7a",.55,700); fx.shake(16,650); bbShards(); bbFxAt(e.id,"−1 ♥","bbplus",1400)?.animate([{transform:"translate(-50%,-60px)",opacity:1},{transform:"translate(-50%,-110px)",opacity:0}],{duration:1400}); }
    else if(e.k==="plus"){ BBS.plus(); const el=bbFxAt(e.id,"+1 ♥","bbplus",1400); el&&el.animate([{transform:"translate(-50%,-60px) scale(.6)",opacity:0},{transform:"translate(-50%,-90px) scale(1.3)",opacity:1},{transform:"translate(-50%,-130px)",opacity:0}],{duration:1400}); }
    else if(e.k==="sug"){ if(bbMeIds(s).includes(e.id)){ SFX.count(); bbSugFor=e.label||"?"; bbFb(`Mente du <b>«${esc(bbSugFor)}»</b>? <small>Enter eller trykk her = ja · skriv noe annet = nei</small>`,"sug",0); } }
    else if(e.k==="turn"){ if(bbSugFor&&!bbMeIds(s).includes(e.id)){ bbSugFor=null; const f=$("bbFb"); if(f&&f.classList.contains("sug")) f.className="bbfb"; }
      if(bbMeIds(s).includes(e.id)){ SFX.bubble(); const i=$("bbInp"); if(i){ setTimeout(()=>{ i.focus(); if(i.value) bbSendTyping(i.value); },30); } } }
    else if(e.k==="end"){ BBS.win(); } } }
function bbDraw(s){ if(!$("bbArena")) bbRenderArena(); const prev=bbLast; bbLast=s;
  const n=s.players.length, cur=s.players[s.turn], meIds=bbMeIds(s), mine=s.phase==="play"&&meIds.includes(cur.id), p=s.pressure, danger=s.phase==="play"&&p>.68;
  // sitteplasser
  const seats=$("bbSeats"); if(!prev||prev.players.length!==n) seats.innerHTML=s.players.map((pl,i)=>{ const pos=bbSeatPos(i,n); return `<div class="bbseat" data-pid="${esc(pl.id)}" style="left:${pos.x}%;top:${pos.y}%"></div>`; }).join("");
  s.players.forEach((pl,i)=>{ const el=seats.children[i]; if(!el) return; const isCur=s.phase==="play"&&i===s.turn;
    el.className="bbseat"+(isCur?" cur":"")+(pl.out?" out":"");
    const hearts="♥".repeat(Math.max(0,pl.lives))+`<span class="e">${"♥".repeat(Math.max(0,Math.min(s.set.cap,Math.max(pl.lives,s.set.lives))-pl.lives))}</span>`;
    const sum=pl.segs.reduce((a,t)=>a+TIERS[t].pts,0)||1, frac=Math.min(1,pl.pts/s.set.pph);
    const prog=pl.segs.map(t=>`<i style="width:${TIERS[t].pts/sum*frac*100}%;background:${TIERS[t].color}"></i>`).join("");
    const pos=bbSeatPos(i,n), low=pos.y>75;   // nederste plass: svarboblen ved siden av, ellers under steinen
    const off=low?18:132, side=low?(innerWidth<640?"left:calc(100% + 34px)":"left:calc(100% + 70px)"):"";
    let say="";
    if(isCur&&pl.typing) say=`<div class="bbsay typ" style="top:${off}px;${side}">${esc(pl.typing)}</div>`;
    else if(pl.last&&!pl.last.bad) say=`<div class="bbsay${bbChanged(pl)?" pop":""}" style="top:${off}px;${side};color:${TIERS[pl.last.tier].color};border-color:${TIERS[pl.last.tier].color}66"><span class="tl" style="color:${TIERS[pl.last.tier].color}">▸ ${TIERS[pl.last.tier].name.toUpperCase()}</span>${esc(pl.last.label)}</div>`;
    const bad=pl.last&&pl.last.bad&&isCur?`<div class="bbbad${pl.last.sug?" sug"+(Date.now()-(pl.last.t||0)<380?" anim":""):""}" style="top:${off+34}px;${side}">${esc(pl.last.msg)}</div>`:"";
    el.innerHTML=`<div class="av">${bbAvatar(pl,i)}</div><div class="rock"></div><div class="nm">${pl.bot?"🤖 ":""}${esc(pl.n)}${(!BB||BB.net)&&meIds.includes(pl.id)?" (deg)":""}</div><div class="hp">${pl.gone?'<span class="e">frakoblet</span>':hearts}</div><div class="prog">${prog}</div>${say}${bad}`; });
  // kategori
  const cat=$("bbCat"); if(s.cat&&s.phase!=="end"){ cat.style.display=""; cat.innerHTML=`<small>KATEGORI ${s.cat}</small><b>${esc(s.qText)}</b>${s.answers.length?`<div class="bbused"><span>Allerede sagt:</span>${s.answers.slice(-10).map(x=>`<em style="color:${TIERS[x[1]].color}">${esc(x[0])}</em>`).join("")}${s.answers.length>10?`<span>+${s.answers.length-10}</span>`:""}</div>`:`<i>Et godkjent svar sender boblen videre. Sjeldne svar gir mer luft.</i>`}`; } else cat.style.display="none";
  // boblen: svømmer mot den som har tur
  const bub=$("bbBubble"), tgt=s.phase==="end"&&s.winner?s.players.findIndex(x=>x.id===s.winner):s.turn, tp=bbSeatPos(Math.max(0,tgt),n);
  const cy=innerWidth<640?60:57, bx=s.phase==="ready"?50:50+(tp.x-50)*.3, by=s.phase==="ready"?cy:cy+(tp.y-cy)*.3;
  bub.style.left=bx+"%"; bub.style.top=by+"%";
  const mood=s.phase==="ready"?"sleep":s.phase==="end"?"happy":"";
  bub.style.display=s.phase==="pop"?"none":"";
  bub.innerHTML=bbBubbleSVG(s.phase==="play"?p:.05,mood);
  if(s.phase==="play"){ const wob=p>.5?(p-.5)*14:0; bub.style.transform=`translate(-50%,-50%) rotate(${Math.sin(Date.now()/(120-p*70))*wob}deg) scale(${1+Math.sin(Date.now()/90)*p*.03})`; } else bub.style.transform="translate(-50%,-50%)";
  // nedtelling og vinner
  const cd=$("bbCount"); if(s.phase==="ready"&&s.countdown>0){ cd.style.display=""; if(!prev||prev.countdown!==s.countdown){ cd.innerHTML=`${s.countdown}<small>GJØR DEG KLAR</small>`; cd.animate([{transform:"translate(-50%,-50%) scale(1.8)",opacity:0},{transform:"translate(-50%,-50%) scale(1)",opacity:1}],{duration:300,easing:"ease-out"}); } } else cd.style.display="none";
  const win=$("bbWin"); if(s.phase==="end"){ const w=s.players.find(x=>x.id===s.winner); win.style.display=""; win.innerHTML=`<b>${esc(w?w.n.toUpperCase():"INGEN")}</b><span>${w&&meIds.includes(w.id)&&(BB?BB.net:true)?"DU VANT RUNDEN!":"VINNER RUNDEN"}</span>`; if(!prev||prev.phase!=="end") bbAfter(s); } else { win.style.display="none"; if($("bbAfter").innerHTML) $("bbAfter").innerHTML=""; }
  // tidsfølelse: rød kant, puls og hjerteslag i faresonen
  const vig=$("bbVig"); vig.style.opacity=danger?Math.min(1,(p-.68)/.32)*(.55+.45*Math.abs(Math.sin(Date.now()/(260-p*140)))):0;
  const bar=$("bbBar"); bar.classList.toggle("danger",danger); bar.style.display=s.phase==="end"?"none":"";
  $("bbTime").style.width=(s.phase==="play"?p*100:0)+"%";
  if(s.phase==="play"){ const now=Date.now(); const beat=danger?Math.max(220,700-(p-.68)*1400):0;
    if(beat&&(!bbDraw._hb||now-bbDraw._hb>beat)){ bbDraw._hb=now; BBS.heart(p); }
    if(!bbDraw._inf||now-bbDraw._inf>1300-p*800){ bbDraw._inf=now; if(p>.2) BBS.inflate(p); } }
  // inndata
  const inp=$("bbInp"), hint=$("bbHint"), me=s.players.find(x=>meIds.includes(x.id)&&(BB&&!BB.net?x.id===cur.id:true))||s.players.find(x=>meIds.includes(x.id));
  // Feltet er alltid åpent (tastaturet blir stående på mobil); du kan skrive klart mens du venter, men bare sende på din tur
  $("bbGo").disabled=!mine; $("bbBar").classList.toggle("mine",mine);
  if(mine&&document.activeElement!==inp) inp.focus();
  inp.placeholder=s.phase!=="play"?"Vent på boblen …":mine?"Din tur – skriv!":`Vent – ${cur.n} har boblen`;
  hint.innerHTML=s.phase!=="play"?"&nbsp;":mine?`<b>▸ ${BB&&!BB.net&&meIds.length>1?esc(cur.n)+", din tur":"Din tur"}</b> · skriv et svar${danger?" – <b>FORT!</b>":""}`:`▸ <b>${esc(cur.n)}</b> har boblen`;
  if(me){ const fr=Math.min(1,me.pts/s.set.pph), C=2*Math.PI*22; $("bbHeart").innerHTML=`<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="rgba(6,24,40,.9)" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle cx="26" cy="26" r="22" fill="none" stroke="#ff5d7a" stroke-width="4" stroke-dasharray="${C*fr} ${C}" stroke-linecap="round"/></svg><b>♥${me.lives}</b>`; }
  bbEffects(s); }
function bbAfter(s){ const ps=[...s.players].sort((a,b)=>(b.out?0:1)-(a.out?0:1)||b.lives-a.lives||b.ans-a.ans), host=!!BB;
  $("bbAfter").innerHTML=`<div class="panel glass" style="text-align:left;max-width:560px;margin:0 auto 12px"><h3>Resultat</h3><ul class="lb">${ps.map((p,i)=>`<li><span class="pos">${i+1}</span><span class="nm">${esc(p.n)}</span><span class="sc">${p.ans} svar</span><span class="sc" style="color:#ffd36b">${p.rare} sjeldne</span></li>`).join("")}</ul></div>
   <div style="text-align:center"><div class="sect">Hvordan var runden?</div><div class="bbrate">${[1,2,3,4,5].map(n=>`<button data-r="${n}">${n}</button>`).join("")}</div><small style="color:var(--muted)">1 · kjedelig &nbsp; 5 · kjempegøy</small></div>
   <div class="btnrow" style="margin-top:14px">${host?`<button class="btn btn-primary" id="bbAgain">Spill igjen</button>`:`<span class="psub">Venter på at verten starter neste runde …</span>`}<button class="btn btn-ghost" id="bbLobby">${host&&BB.net?"Til lobbyen":host?"Til oppsett":"Forlat"}</button></div>`;
  $("bbAfter").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ $("bbAfter").querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===b)); const l=store.get("dypdykk-boble-vurdering")||[]; l.push({r:+b.dataset.r,d:todayKey()}); store.set("dypdykk-boble-vurdering",l.slice(-50)); toast("Takk!"); });
  if($("bbAgain")) $("bbAgain").onclick=()=>{ const pl=BB.players.filter(p=>!p.gone).map(p=>({id:p.id,n:p.n,bot:p.bot,local:p.local})), set=BB.set, net=BB.net; bbStart(pl,set,net); };
  $("bbLobby").onclick=()=>{ if(BB&&BB.net){ bbStop(false); netLobbySync(); netLobbyRender(); } else { bbStop(true); route(); } }; }
function bbStop(closeNet){ document.body.classList.remove("bbplay"); clearInterval(bbTimer); bbTimer=null; cancelAnimationFrame(bbAnim); if(closeNet&&(BB&&BB.net||!BB)&&NET.peer) NET.close(); BB=null; bbLast=null; const v=$("bbVig"); if(v) v.remove(); }
// jevn animasjon av boblen (pressure tegnes ~25 fps også mellom synker)
function bbLoop(){ bbAnim=requestAnimationFrame(bbLoop); if(!bbLast||!$("bbArena")) return; const now=performance.now(); if(bbLoop._t&&now-bbLoop._t<40) return; bbLoop._t=now;
  if(bbLast.phase==="play"){ const bub=$("bbBubble"); if(bub){ const p=bbLast.pressure, wob=p>.5?(p-.5)*14:0; bub.style.transform=`translate(-50%,-50%) rotate(${Math.sin(Date.now()/(120-p*70))*wob}deg) scale(${1+Math.sin(Date.now()/90)*p*.03})`; }
    const vig=$("bbVig"); if(vig&&bbLast.pressure>.68) vig.style.opacity=Math.min(1,(bbLast.pressure-.68)/.32)*(.55+.45*Math.abs(Math.sin(Date.now()/(260-bbLast.pressure*140)))); } }

/* ----- Oppsettsiden ----- */
function bbStepper(k,v){ const [lo,hi,st]=BB_LIM[k]; const show=k==="minTurn"?v+" s":v;
  return `<div class="row"><div><b>${BB_LBL[k]}</b><small>${BB_HELP[k]}</small></div><div class="bbstep"><button data-k="${k}" data-d="-1" ${v<=lo?"disabled":""} aria-label="Færre ${BB_LBL[k].toLowerCase()}">◀</button><b>${show}</b><button data-k="${k}" data-d="1" ${v>=hi?"disabled":""} aria-label="Flere ${BB_LBL[k].toLowerCase()}">▶</button></div></div>`; }
function bbSettingsPanel(s,keys){ return `<div class="bbsettings">${keys.map(k=>bbStepper(k,s[k])).join("")}</div>`; }
function bbBindSteppers(root,s,after){ root.querySelectorAll(".bbstep button").forEach(b=>b.onclick=()=>{ const k=b.dataset.k, [lo,hi,st]=BB_LIM[k];
  s[k]=Math.max(lo,Math.min(hi,s[k]+(+b.dataset.d)*st)); if(k==="cap"&&s.lives>s.cap) s.lives=s.cap; if(k==="lives"&&s.lives>s.cap) s.cap=s.lives;
  bbSaveSettings(s); SFX.count(); after(); }); }

PAGES.boblebomben=()=>{ const names=store.get("dypdykk-party-names")||[myName()||"Spiller 1"], s=bbSettings();
  return head("Boblebomben","Send boblen videre før den sprekker! Svar på kategorien, så går boblen til neste. Sjeldne svar slipper ut luft og fyller opp et ekstra hjerte.")+
   `<div class="party">${typeof onlinePanel==="function"?onlinePanel():""}
     <div class="panel glass"><h3>Spill på denne enheten</h3><div class="bomb" style="height:120px">${bbBubbleSVG(.15,"sleep")}</div>
       <div id="pNames">${names.map((n,i)=>`<div class="rowf" style="margin-bottom:8px"><input class="field pn" maxlength="16" value="${esc(n)}" placeholder="Navn"><button class="btn btn-ghost pdel" style="padding:10px 14px" data-i="${i}">✕</button></div>`).join("")}</div>
       <button class="btn btn-ghost" id="pAdd" style="width:100%">+ Legg til spiller</button>
       <button class="btn btn-primary" id="pStart" style="width:100%;margin-top:12px">Vekk boblen</button></div>
     <div class="panel glass"><h3>Regler for rommet</h3><div id="bbSet">${bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"])}</div></div>
     <div class="panel glass full"><h3>Slik spiller du</h3><ol class="steps">
       <li>Alle får samme kategori. Den som har boblen, skriver et svar som ikke er sagt før i kategorien.</li>
       <li>Boblen blåses opp hele tiden og sprekker på et skjult tidspunkt. Når den blir rød og skjermkanten pulserer, haster det.</li>
       <li>Et godkjent svar sender boblen videre. Sjeldne svar gir mer poeng – nok poeng gir et ekstra hjerte – og slipper ut litt luft.</li>
       <li>Sprekker boblen hos deg, mister du et hjerte, og det kommer en ny kategori. Sist igjen med hjerter vinner.</li></ol></div></div></div>`; };
PAGE_INIT.boblebomben=()=>{
  const save=()=>store.set("dypdykk-party-names",[...document.querySelectorAll(".pn")].map(i=>i.value.trim()).filter(Boolean));
  if(typeof onlineInit==="function") onlineInit();
  const s=bbSettings(); const rebind=()=>{ $("bbSet").innerHTML=bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"]); bbBindSteppers($("bbSet"),s,rebind); }; bbBindSteppers($("bbSet"),s,rebind);
  $("pAdd").onclick=()=>{ save(); const l=store.get("dypdykk-party-names")||[]; if(l.length>=bbSettings().seats){toast("Rommet har "+bbSettings().seats+" plasser");return;} l.push("Spiller "+(l.length+1)); store.set("dypdykk-party-names",l); route(); };
  document.querySelectorAll(".pdel").forEach(b=>b.onclick=()=>{ save(); const l=store.get("dypdykk-party-names")||[]; l.splice(+b.dataset.i,1); store.set("dypdykk-party-names",l); route(); });
  $("pStart").onclick=async()=>{ save(); const st=bbSettings(), names=(store.get("dypdykk-party-names")||[]).slice(0,st.seats);
    const players=[...names.map((n,i)=>({id:"l"+i,n,local:true})),...Array.from({length:Math.max(0,Math.min(st.bots,st.seats-names.length))},(_,i)=>({id:"b"+i,n:"Dykkebot "+(i+1),bot:true}))];
    if(players.length<2){ toast("Dere må være minst to (legg til en datamotstander)"); return; }
    if(players.every(p=>p.bot)){ toast("Minst én spiller må være et menneske"); return; }
    $("pStart").disabled=true; $("pStart").textContent="Laster …"; ac(); await datasetsReady; bbMe=""; bbStart(players,st,false); bbLoop(); }; };

/* ----- Online: verten kjører motoren, gjestene får tilstanden ----- */
const _netHostData=netHostData;
netHostData=function(id,d){ if(!d||typeof d!=="object") return;
  if(d.t==="ans"&&BB&&BB.net) return bbSubmit(String(d.v||"").slice(0,60),id);
  if(d.t==="typ"&&BB&&BB.net) return bbTyping(String(d.v||"").slice(0,40),id); };
const _netGone=netGone;
netGone=function(id){ if(BB&&BB.net){ if(!NET.conns.has(id)) return; NET.conns.delete(id); const i=NET.lobby.findIndex(p=>p.id===id); if(i>=0) NET.lobby.splice(i,1);
    const p=BB.players.find(x=>x.id===id); if(p&&!p.out){ p.gone=true; p.out=true; p.lives=0; toast(`${p.n} forlot spillet`); const alive=bbAlive();
      if(alive.length<=1&&BB.phase!=="end"){ BB.phase="end"; BB.winner=alive[0]?alive[0].id:null; bbEv({k:"end",id:BB.winner}); clearInterval(bbTimer); }
      else if(BB.players[BB.turn]===p&&BB.phase==="play"){ BB.turn=bbNextTurn(BB.turn); bbTurnStart(); } bbSync(); } return; }
  return _netGone(id); };
// Lobbyen får innstillingene fra Krillion-oppsettet
const _netLobbyRender=netLobbyRender;
netLobbyRender=function(){ if(BB) return; const s=bbSettings(); PARTY.bots=s.bots; PARTY.lives=s.lives; _netLobbyRender(); const lob=$("netLobby"); if(!lob) return;
  const panels=lob.querySelectorAll(".panel"); const setPanel=panels[1]; if(setPanel){ setPanel.innerHTML=`<h3>Regler for rommet</h3><div id="bbSet">${bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"])}</div>`;
    const rebind=()=>{ $("bbSet").innerHTML=bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"]); bbBindSteppers($("bbSet"),s,()=>{ rebind(); PARTY.bots=s.bots; PARTY.lives=s.lives; netLobbySync(); }); }; rebind(); }
  const st=$("nlStart"); if(st){ st.textContent="Vekk boblen"; st.onclick=async()=>{ const s2=bbSettings(); const humans=NET.lobby.slice(0,s2.seats);
    const players=[...humans.map(p=>({id:p.id||"host",n:p.n})),...Array.from({length:Math.max(0,Math.min(s2.bots,s2.seats-humans.length))},(_,i)=>({id:"b"+i,n:"Dykkebot "+(i+1),bot:true}))];
    if(players.length<2) return toast("Dere må være minst to (vent på venner eller legg til en datamotstander)");
    st.disabled=true; st.textContent="Laster …"; await datasetsReady; NET.all({t:"start"}); bbMe="host"; bbStart(players,s2,true); bbLoop(); }; } };
const _netLobbySync=netLobbySync;
netLobbySync=function(){ const s=bbSettings(); NET.all({t:"lobby",code:NET.code,players:NET.lobby.map(p=>p.n),lives:s.lives,bots:s.bots,set:s}); if($("netLobby")) netLobbyRender(); };
// Gjesten: tegner tilstanden fra verten
const _netClientData=netClientData;
netClientData=function(d){ if(d&&d.t==="bb"){ bbMe=NET.myId; if(!$("bbArena")){ bbEvSeen=d.s.evn-1; bbRenderArena(); bbLoop(); } bbDraw(d.s); return; }
  if(d&&d.t==="lobby"&&$("bbArena")){ $("page").innerHTML=""; }
  if(d&&d.t==="lobby"){ _netClientData(d); const v=$("netLobby"); if(v&&d.set){ const ps=v.querySelector(".psub:last-child"); if(ps) ps.textContent=`${d.set.lives} liv · minste tur ${d.set.minTurn} s · hjertetak ${d.set.cap} · ${d.set.pph} poeng per hjerte`; } return; }
  return _netClientData(d); };

startScreen(); route();
</script>
