<style>
:root{
  --ink:#eaf6fb; --muted:#8db4c6; --cyan:#5ef2d6; --blue:#36b7ff; --warn:#ff7a6b;
  --glass:rgba(8,26,44,.52); --edge:rgba(160,230,255,.16);
  --mono:'JetBrains Mono',ui-monospace,monospace; --head:'Space Grotesk',Inter,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#02060d;color:var(--ink);font-family:Inter,system-ui,sans-serif}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:22px;
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:0 20px 60px rgba(0,8,20,.45), inset 0 1px 0 rgba(255,255,255,.06)}
.fade{transition:opacity .55s ease, transform .55s cubic-bezier(.2,.8,.2,1);opacity:0;pointer-events:none}

/* ---------- Knapper ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;font-weight:700;
  padding:16px 34px;font-size:17px;transition:transform .2s, box-shadow .2s, filter .2s}
.btn-primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#03202c;
  box-shadow:0 10px 34px rgba(54,183,255,.38), inset 0 1px 0 rgba(255,255,255,.45)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(54,183,255,.5)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--ink);backdrop-filter:blur(10px)}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.arrow{display:inline-block;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}

/* ---------- Dykkeren ---------- */
#diver{position:fixed;left:50%;width:62px;height:78px;margin-left:-31px;margin-top:-39px;z-index:4;pointer-events:none;top:60%}
#diver .rot{width:100%;height:100%;transition:transform .7s cubic-bezier(.5,0,.2,1)}
#diver.dive .rot{transform:rotate(180deg)}
#diver .bob{width:100%;height:100%;animation:bob 2.8s ease-in-out infinite}
#diver svg{width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
@keyframes bob{50%{transform:translateY(5px) rotate(-3deg)}}
#tag{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translate(-50%,6px);white-space:nowrap;
  font-family:var(--mono);font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;
  background:rgba(4,20,34,.7);border:1px solid rgba(160,240,255,.5);color:#dffcff;
  box-shadow:0 0 24px rgba(94,242,214,.35);opacity:0;transition:opacity .35s, transform .35s}
#tag.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Startskjerm ---------- */
#start .top{position:fixed;left:0;right:0;top:max(7vh,28px);text-align:center;z-index:5;padding:0 18px}
#start .bottom{position:fixed;left:0;right:0;bottom:max(4vh,18px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 18px}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#cfe9f5;opacity:.85}
.title{font-family:var(--head);font-weight:700;font-size:clamp(58px,13vw,128px);line-height:.95;letter-spacing:.03em;margin:10px 0 12px;
  background:linear-gradient(100deg,#ffffff 30%,#aef7ff 45%,#ffffff 60%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite;
  filter:drop-shadow(0 8px 30px rgba(10,30,70,.55))}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.sub{max-width:460px;margin:0 auto;font-size:16px;line-height:1.5;color:#e2f2fa;text-shadow:0 2px 12px rgba(0,20,40,.6)}
.tierrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:470px;margin-top:6px}
.tierrow div{text-align:center;font-size:11px;color:var(--muted)}
.tierrow svg{width:34px;height:34px;display:block;margin:0 auto 4px;filter:drop-shadow(0 0 10px rgba(94,242,214,.15))}
.tierrow b{display:block;font-size:11.5px;color:var(--ink);font-weight:600}
.donebox{font-size:15px;color:#d9eef7;text-align:center}
.donebox b{color:var(--cyan);font-family:var(--mono)}
.stats{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.05em}
body.s-start #start .top, body.s-start #start .bottom{opacity:1;pointer-events:auto;transform:none}
#start .top{transform:translateY(-14px)} #start .bottom{transform:translateY(14px)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;
  padding:max(14px,env(safe-area-inset-top)) 18px 0;transform:translateY(-10px)}
body:not(.s-start) #hud{opacity:1;transform:none}
.hbox{min-width:96px}
.hbox .lbl{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.hbox .val{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--cyan);font-variant-numeric:tabular-nums}
.hbox.r{text-align:right}.hbox.r .val{color:#ffd36b}
.pips{display:flex;gap:7px}
.pips i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.14);transition:all .4s;position:relative}
.pips i.now{background:transparent;box-shadow:0 0 0 2px var(--cyan)}
.pips i.now::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--cyan);animation:ping 1.6s infinite}
@keyframes ping{from{opacity:.8;transform:scale(.6)}to{opacity:0;transform:scale(1.4)}}
#mute{position:fixed;left:14px;top:calc(max(14px,env(safe-area-inset-top)) + 52px);z-index:9;width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.07);border:1px solid var(--edge);display:grid;place-items:center;color:var(--muted)}
#mute svg{width:18px;height:18px}
body.s-start #mute{top:auto;bottom:max(16px,env(safe-area-inset-bottom));left:auto;right:16px}

/* ---------- Spørsmålskort ---------- */
#qcard{position:fixed;left:50%;top:clamp(66px,10vh,96px);width:min(580px,92vw);z-index:5;padding:18px 24px 20px;transform:translate(-50%,-18px)}
body.s-countdown #qcard, body.s-answer #qcard{opacity:1;transform:translate(-50%,0)}
#qcard .qn{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--cyan);text-transform:uppercase}
#qcard h2{font-family:var(--head);font-weight:700;font-size:clamp(22px,4.4vw,30px);line-height:1.15;margin:8px 0 6px}
#qcard .hint{font-size:13px;color:var(--muted)}

/* ---------- Nedtelling ---------- */
#countdown{position:fixed;left:50%;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 8px);transform:translate(-50%,12px);z-index:6;
  font-family:var(--mono);font-size:13px;letter-spacing:.12em;padding:12px 20px;border-radius:999px;color:#cdeefa}
#countdown b{color:var(--cyan);font-size:16px;display:inline-block;min-width:14px;text-align:center}
body.s-countdown #countdown{opacity:1;transform:translate(-50%,0)}

/* ---------- Svarfelt ---------- */
#bar{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));width:min(620px,94vw);z-index:7;transform:translate(-50%,30px)}
body.s-answer #bar{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.barrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:rgba(255,255,255,.1)}
.ring .fg{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:138.2;transition:stroke .3s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:16px}
.ring.low .fg{stroke:var(--warn)} .ring.low span{color:var(--warn);animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.15)}}
#inp{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink);font:500 19px Inter,sans-serif;padding:10px 4px}
#inp::placeholder{color:rgba(200,230,245,.4)}
#go{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#03202c;font-weight:800;border-radius:999px;padding:14px 22px;font-size:15px;letter-spacing:.06em;flex:none}
#go:hover{filter:brightness(1.08)}
.barrow.err{animation:shake .38s;box-shadow:0 0 0 1px rgba(255,122,107,.6),0 0 34px rgba(255,122,107,.25)}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.msg{position:absolute;left:0;right:0;bottom:calc(100% + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.pill{pointer-events:auto;font-size:14px;padding:9px 16px;border-radius:999px;max-width:100%;text-align:center;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}}
.pill.bad{background:rgba(70,14,14,.72);border:1px solid rgba(255,122,107,.55);color:#ffd1ca}
.pill.sug{background:rgba(6,40,56,.8);border:1px solid rgba(94,242,214,.55);color:#dffcf6;cursor:pointer}
.pill.sug b{color:var(--cyan)}
.pill small{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
.tried{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tried span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,122,107,.12);border:1px solid rgba(255,122,107,.32);color:#ffbdb3;text-decoration:line-through}
.skip{display:block;margin:10px auto 0;font-size:12.5px;color:var(--muted);letter-spacing:.06em;opacity:.7}
.skip:hover{opacity:1}

/* ---------- Dykkeeffekter ---------- */
#bigDepth{position:fixed;left:50%;top:calc(var(--dy,34%) + 110px);transform:translate(-50%,0) scale(.8);z-index:6;pointer-events:none;opacity:0;text-align:center;
  font-family:var(--mono);font-weight:700;color:#eafcff;text-shadow:0 0 30px rgba(94,242,214,.45);transition:opacity .3s,transform .4s cubic-bezier(.2,1.4,.4,1)}
#bigDepth .bd-n{font-size:clamp(54px,12vw,104px);letter-spacing:-.02em}
#bigDepth .bd-u{font-size:clamp(22px,4vw,34px);margin-left:8px;opacity:.7}
#bigDepth .bd-l{font-size:12px;letter-spacing:.3em;text-transform:uppercase;opacity:.6;margin-top:-4px}
#bigDepth.on{opacity:1;transform:translate(-50%,0) scale(1)}
#bigDepth.done{transform:translate(-50%,0) scale(1.18);color:var(--bc)}
#flash{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 40%,var(--fc,#5ef2d6) 0%,transparent 70%);mix-blend-mode:screen}
/* ---------- Resultat per svar ---------- */
#reveal{position:fixed;left:50%;top:calc(var(--dy,36%) + 70px);width:min(520px,92vw);z-index:5;text-align:center;padding:26px 24px 22px;transform:translate(-50%,16px);max-height:calc(100% - var(--dy,36%) - 80px);overflow:auto}
body.s-reveal #reveal{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.ricon{position:relative;width:86px;height:86px;margin:-6px auto 6px}
.ricon svg{position:relative;width:86px;height:86px;z-index:2;animation:iconin .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes iconin{from{transform:scale(.2) rotate(-25deg);opacity:0}}
.ricon .burst{position:absolute;inset:0;border-radius:50%;border:2px solid var(--tc);opacity:0;animation:burst 1.4s ease-out .1s}
.ricon .burst.b2{animation-delay:.35s}
.ricon .glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--tc) 0%,transparent 65%);opacity:.28;animation:glow 2.4s ease-in-out infinite}
@keyframes burst{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.4)}}
@keyframes glow{50%{opacity:.45;transform:scale(1.08)}}
.tname{font-family:var(--head);font-weight:700;font-size:clamp(30px,8.6vw,52px);line-height:1.05;letter-spacing:.02em;overflow-wrap:anywhere;margin:4px 0 2px;color:var(--tc);text-shadow:0 0 28px color-mix(in srgb,var(--tc) 55%,transparent)}
.tname.long{font-size:clamp(25px,6.4vw,42px);overflow-wrap:normal}
.rquote{font-family:var(--mono);font-size:15px;color:#e8f6fb;margin:4px 0 8px}
.rmeta{font-family:var(--mono);font-size:14px;color:var(--tc);font-weight:700}
.rmeta span{color:var(--muted);font-weight:500}
.rbar{display:flex;gap:5px;justify-content:center;margin:14px 0 6px}
.rbar i{width:30px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);transform-origin:left;animation:fillin .4s both}
@keyframes fillin{from{transform:scaleX(0)}}
.rword{display:inline-block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin:2px 0 8px;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);opacity:.85}
.rscale{display:flex;justify-content:space-between;width:min(210px,70%);margin:0 auto 4px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.flavor{font-size:14px;color:#bcd6e2;margin:6px 0 2px}
.sect{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--edge)}
#reveal .btn{margin-top:20px;width:100%}

/* ---------- Oppsummering ---------- */
#summary{position:fixed;inset:0;z-index:8;overflow:auto;background:linear-gradient(180deg,rgba(2,8,16,.35),rgba(2,8,16,.8));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body.s-summary #summary{opacity:1;pointer-events:auto}
.sum{max-width:640px;margin:0 auto;padding:max(28px,6vh) 18px 90px}
.sum .kicker{color:var(--cyan)}
.bignum{display:flex;align-items:baseline;gap:12px;margin:10px 0 4px;flex-wrap:wrap}
.bignum b{font-family:var(--head);font-size:clamp(72px,16vw,112px);line-height:.9;font-weight:700;
  background:linear-gradient(180deg,#fff,#9eeefe);-webkit-background-clip:text;background-clip:text;color:transparent}
.bignum span{font-family:var(--mono);color:var(--muted);font-size:16px}
.bignum em{font-style:normal;font-family:var(--mono);color:var(--cyan);font-size:16px}
.rank{font-family:var(--head);font-size:22px;font-weight:700;margin:6px 0 2px}
.rank+p{color:#bcd6e2;margin:0 0 22px;font-size:15px}
.panel{padding:20px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
#log svg{width:100%;height:auto;display:block;overflow:visible}
.drop{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1s cubic-bezier(.5,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dropicon{opacity:0;animation:appear .5s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes appear{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.alist{list-style:none;padding:0;margin:0}
.alist li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(160,230,255,.1);font-size:14px}
.alist li:first-child{border-top:0}
.alist svg{width:30px;height:30px;flex:none}
.alist .q{flex:1;color:#cfe3ec}
.alist .q small{display:block;color:var(--ink);font-weight:600;font-size:14.5px;margin-top:1px}
.alist .t{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.alist .miss{width:30px;height:30px;border-radius:50%;border:1.5px dashed rgba(255,122,107,.6);flex:none}
.share{font-family:var(--mono);white-space:pre-wrap;font-size:14px;line-height:1.6;background:rgba(0,0,0,.25);border-radius:14px;padding:14px 16px;border:1px solid var(--edge);margin-bottom:12px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1;min-width:160px}
.records{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.records b{display:block;font-family:var(--mono);font-size:22px;color:var(--cyan)}
.records span{font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);z-index:20;padding:10px 18px;border-radius:999px;font-size:14px;
  background:rgba(3,32,44,.92);border:1px solid var(--cyan);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ---------- Toppknapper ---------- */
.iconbtn{position:fixed;z-index:9;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(6,22,38,.45);border:1px solid var(--edge);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#d7eef7;transition:background .2s,opacity .4s}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.iconbtn svg{width:19px;height:19px}
#menuBtn{left:14px;top:max(14px,env(safe-area-inset-top))}
#profBtn{right:62px;top:max(14px,env(safe-area-inset-top))}
#gearBtn{right:14px;top:max(14px,env(safe-area-inset-top))}
body.s-countdown .iconbtn,body.s-answer .iconbtn,body.s-diving .iconbtn,body.s-reveal .iconbtn,body.s-intro .iconbtn{opacity:0;pointer-events:none}
body:not(.s-start):not(.s-summary):not(.s-page) #profBtn,body:not(.s-start):not(.s-summary):not(.s-page) #gearBtn{opacity:0;pointer-events:none}
body.s-summary #menuBtn,body.s-page #menuBtn{z-index:12}
body.s-start #mute{display:none}

/* ---------- Meny ---------- */
#menuWrap{position:fixed;inset:0;z-index:30;pointer-events:none}
#menuWrap .scrim{position:absolute;inset:0;background:rgba(1,6,14,.55);opacity:0;transition:opacity .35s}
#menu{position:absolute;left:0;top:0;bottom:0;width:min(400px,92vw);padding:max(18px,env(safe-area-inset-top)) 18px 24px;overflow:auto;
  background:linear-gradient(180deg,rgba(8,30,50,.92),rgba(4,14,28,.96));border-right:1px solid var(--edge);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transform:translateX(-104%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#menuWrap.open{pointer-events:auto}#menuWrap.open .scrim{opacity:1}#menuWrap.open #menu{transform:none}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.mhead .mlogo{width:42px;height:42px}
.mhead b{font-family:var(--head);font-size:24px;letter-spacing:.06em;display:block}
.mhead small{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}

.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfe3ec;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}

const $=id=>document.getElementById(id);
function norm(s){return s.toLowerCase().replace(/\+\+/g,"pp").replace(/#/g,"sharp").replace(/æ/g,"ae").replace(/ø/g,"o").replace(/å/g,"a")
  .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");}
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 9;
  const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length]; }
function parse(q){ if(q._p) return q._p; const out=[];
  if(q.src){ const pre=q._data&&q._data.k; (q._data?q._data.e:[]).forEach(r=>out.push({label:r[0],tier:Math.max(0,Math.min(5,r[1]|0)),keys:pre?null:[r[0],...r.slice(2)].map(norm)})); }
  else q.a.split("|").forEach((g,ti)=>g.split(",").forEach(it=>{const n=it.split("/").map(s=>s.trim()).filter(Boolean);
    if(n.length) out.push({label:n[0],tier:Math.min(ti,5),keys:n.map(norm)});}));
  if(q.src&&!q._data) return out;
  // Oppslagstabell: nøkkel -> svar (første forekomst vinner; listen er sortert fra mest til minst kjent)
  const map=new Map(), byLen=new Map();
  const add=(k,a)=>{ if(!k||map.has(k)) return; map.set(k,a); let b=byLen.get(k.length); if(!b) byLen.set(k.length,b=[]); b.push(k); };
  if(q.src&&q._data.k){ // ferdig normaliserte nøkler fra importen: mye raskere på mobil
    const L=q._data.k.split("\n"); for(let i=0;i<L.length;i++){ const a=out[i], ks=L[i].split("\t"); for(let j=0;j<ks.length;j++) add(ks[j],a); }
    q._data.k=null; }
  else for(const a of out) for(const k of a.keys) add(k,a);
  q._map=map; q._byLen=byLen; return q._p=out; }
// «Løs» stavemåte: fanger lydlike skrivefeil (dobbelkonsonant, ph/f, th/t, w/v, c/k, z/s, y/i, ck/k, aa/a, sch/sj)
function loose(k){ return k.replace(/sch/g,"sj").replace(/ph/g,"f").replace(/th/g,"t").replace(/ck/g,"k").replace(/w/g,"v").replace(/c/g,"k").replace(/z/g,"s").replace(/y/g,"i").replace(/q/g,"k").replace(/x/g,"ks").replace(/h(?=[^aeiou]|$)/g,"").replace(/(.)\1+/g,"$1"); }
// Lager «løse» nøkler i bakgrunnen (i biter, så store lister ikke fryser siden)
function buildLoose(q){ if(q._looseB||!q._map) return; q._looseB=true; const keys=[...q._map.keys()], lm=new Map(), lb=new Map(); let i=0;

  // --- Bobler fra dykkeren ---
  if(cam.d>3 && Math.random()<dt*(document.body.classList.contains("s-diving")?28:3.2))
    bubbles.push({x:W/2+8+Math.random()*8,d:cam.d+(-diverY+diverY-26)/PPM,r:1.5+Math.random()*3.2,w:Math.random()*6.28});
  ctx.strokeStyle="rgba(220,245,255,.6)";ctx.lineWidth=1;
  bubbles=bubbles.filter(b=>{b.d-=dt*(38+b.r*8); const y=surfY+b.d*PPM; if(b.d<0||y<-20)return false;
    const x=b.x+Math.sin(t*3+b.w)*4; ctx.beginPath();ctx.arc(x,y,b.r,0,7);ctx.stroke(); return true;});

  // --- Dybdemåler til høyre ---
  if(!document.body.classList.contains("s-start")||cam.d>5){
    const rx=W-(W<520?30:46); ctx.save();
    ctx.strokeStyle="rgba(170,225,245,.22)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(rx,Math.max(surfY,0));ctx.lineTo(rx,H);ctx.stroke();
    const dTop=Math.max(0,dAt(0)), dBot=dAt(H);
    for(let m=Math.ceil(dTop/50)*50;m<=dBot;m+=50){const y=surfY+m*PPM, major=m%250===0;
      ctx.strokeStyle=`rgba(170,225,245,${major?.55:.25})`;ctx.beginPath();ctx.moveTo(rx-(major?12:6),y);ctx.lineTo(rx,y);ctx.stroke();
      if(major&&m>0&&!LANDMARKS.some(l=>Math.abs(l[0]-m)<40)){ctx.fillStyle="rgba(170,225,245,.6)";ctx.font="500 10px 'JetBrains Mono',monospace";ctx.textAlign="right";ctx.fillText(fmt(m)+" m",rx-16,y+3.5);}}
    // merker
    LANDMARKS.forEach(([m,txt])=>{const y=surfY+m*PPM; if(y<-20||y>H+20)return; const near=clamp(1-Math.abs(y-diverY)/(H*.55),0,1);
      ctx.globalAlpha=.25+.75*near; ctx.fillStyle="#ffd36b"; ctx.beginPath();ctx.arc(rx,y,3.2,0,7);ctx.fill();
      ctx.setLineDash([3,4]);ctx.strokeStyle="rgba(255,211,107,.35)";ctx.beginPath();ctx.moveTo(rx-120,y);ctx.lineTo(rx-6,y);ctx.stroke();ctx.setLineDash([]);
      if(W>560){ctx.fillStyle="rgba(255,233,180,.9)";ctx.font="500 11.5px Inter,sans-serif";ctx.textAlign="right";ctx.fillText(txt,rx-14,y-7);
        ctx.fillStyle="rgba(255,211,107,.85)";ctx.font="700 10px 'JetBrains Mono',monospace";ctx.fillText(fmt(m)+" m",rx-14,y+14);}
      ctx.globalAlpha=1;});
    // dykkerens markør
    ctx.fillStyle="#5ef2d6";ctx.beginPath();ctx.moveTo(rx-1,diverY);ctx.lineTo(rx-11,diverY-6);ctx.lineTo(rx-11,diverY+6);ctx.fill();
    ctx.restore();
  }
  // vignett
  const vg=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.85);
  vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,`rgba(0,4,10,${.25+clamp(cam.d/11000,0,1)*.45})`);
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}

let game=null, timerH=null, cdH=null;

function startScreen(){
  clearInterval(timerH);clearInterval(cdH); if(typeof closeMenu==="function") closeMenu();
  setState("start"); diverYTo(.6,1600); diveTo(0,2200); $("diver").classList.remove("dive");

  $("startBottom").innerHTML=`
    ${done?`<div class="donebox">Dagens dykk er tatt: <b>${fmt(done.score)} p · ${fmt(depthOf(done))} m</b><br><span class="stats">Nytt dykk i morgen</span></div>
      <button class="btn btn-primary" id="seeToday">Se dagens resultat</button>`
    :`<button class="btn btn-primary" id="daily"><span class="arrow">▼</span> Start dagens dykk</button>`}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn btn-ghost" id="practice">Øvingsdykk</button><button class="btn btn-ghost" id="endless">∞ Uendelig</button></div>
    ${st.played?`<div class="stats">Beste: ${fmt(st.best||0)} p · Dykk: ${st.played} · Rekke: ${st.streak||0} dager</div>`:""}
    <div class="tierrow">${TIERS.map((t,i)=>`<div>${ICONS[i]}<b>${t.name.replace("Kjempeblekksprut","Kjempe&shy;blekksprut")}</b>${t.desc}<br><span style="opacity:.7">${fmt(t.m)} m</span></div>`).join("")}</div>`;
  if(done) $("seeToday").onclick=()=>{game=done;showSummary(true);};
  else $("daily").onclick=()=>begin(true);

}

/* Moduser: daily (dagens dykk), practice (øving, 7 tilfeldige), endless (uendelig, 3 liv),
   archive (tidligere dagens dykk), pack (kapittel i en temapakke). */
function dateOfDay(n){const d=new Date(2026,10,1);d.setDate(d.getDate()+n-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function randomQ(exclude){ const pool=QUESTIONS.filter(q=>!exclude.includes(q.id)&&(!q.modes||q.modes.includes("endless")));
  return pool[Math.floor(Math.random()*pool.length)]||QUESTIONS[0]; }
async function begin(mode,opts={}){
  if(mode===true) mode="daily"; if(mode===false||mode===undefined) mode="practice";
  window.__starting=true; setTimeout(()=>{window.__starting=false;},1200);
  if(location.hash) try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  ac(); SFX.bubble(); await datasetsReady;
  const day=mode==="archive"?opts.day:dayNumber();
  const set=mode==="daily"||mode==="archive"?dailySet(day):mode==="pack"?opts.set:mode==="endless"?[randomQ([])]:pickSet(rng(Math.floor(Math.random()*1e9)));
  game={mode,daily:mode==="daily",day,date:mode==="archive"?dateOfDay(day):todayKey(),qs:set.map(q=>q.id),results:[],score:0,i:0,
    rounds:mode==="endless"?Infinity:set.length,lives:mode==="endless"?3:null,pack:opts.pack||null,chapter:opts.chapter||null,packName:opts.packName||null};
  const loading=Promise.all(set.map(ensureLoaded)); game._ready=loading;
  $("hDepth").textContent="0 m"; $("hScore").textContent="0"; renderPips();
  setState("intro"); diverYTo(.34,1500); diveTo(BASE,1700);
  setTimeout(async()=>{ const ok=await loading; if(ok.includes(false)){ // et datasett kunne ikke lastes: bytt det ut
      game.qs=game.qs.map((id,i)=>ok[i]?id:QUESTIONS.find(q=>!q.src&&!game.qs.includes(q.id)).id); }
    nextQ(); },1500);
}

function renderPips(){
  if(game.mode==="endless"){ $("pips").innerHTML=[0,1,2].map(k=>`<i style="${k<game.lives?"background:#ff7a6b;box-shadow:0 0 10px #ff7a6b":"opacity:.35"}"></i>`).join("")
    +`<span style="font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px">#${game.i+1}</span>`; return; }
  $("pips").innerHTML=Array.from({length:game.rounds||ROUNDS},(_,k)=>{const r=game.results[k];
  const st=r?(r.tier>=0?`background:${TIERS[r.tier].color};box-shadow:0 0 12px ${TIERS[r.tier].color}`:"background:rgba(255,122,107,.5)"):"";
  return `<i class="${!r&&k===game.i?"now":""}" style="${st}"></i>`;}).join(""); }

function curQ(){return QUESTIONS.find(x=>x.id===game.qs[game.i]);}

function nextQ(){
  const q=curQ(); renderPips();
  $("qcard").innerHTML=`<div class="qn">${game.mode==="endless"?`Uendelig dykk · spørsmål ${game.i+1} · ${"♥".repeat(game.lives)}`:`Spørsmål ${game.i+1} / ${game.rounds}`}${game.mode==="pack"?" · Kapittel "+game.chapter:""}${q.norsk?" · 🇳🇴 Norge":""}</div><h2>${esc(q.q)}</h2><div class="hint">▼ sjeldnere svar synker dypere</div>`;
  $("msg").innerHTML=""; $("inp").value="";
  setState("countdown"); let n=3; $("cd").textContent=n; SFX.count();
  clearInterval(cdH); cdH=setInterval(()=>{n--; if(n>0){$("cd").textContent=n;SFX.count();} else {clearInterval(cdH);startAnswer();}},750);
}

let tried=[], pending=null, deadline=0, answered=false, lastSec=99;
function startAnswer(){
  setState("answer"); SFX.go(); tried=[]; pending=null; answered=false; lastSec=99;
  const inp=$("inp"); inp.value=""; setTimeout(()=>inp.focus(),60);
  deadline=performance.now()+SECONDS*1000; $("ring").classList.remove("low");
  clearInterval(timerH); timerH=setInterval(tickTimer,50); tickTimer();
}
function tickTimer(){
  const left=Math.max(0,deadline-performance.now()), s=Math.ceil(left/1000);
  $("ringfg").style.strokeDashoffset=138.2*(1-left/(SECONDS*1000)); $("secs").textContent=s;
  if(s<=5){$("ring").classList.add("low"); if(s!==lastSec&&s>0)SFX.tick();} lastSec=s;
  if(left<=0){ clearInterval(timerH); const v=$("inp").value.trim(), r=v?check(curQ(),v):null;
    if(r&&(r.exact||pending===norm(v))) accept(r.a); else { if(v) tried.push(v); accept(null,"time"); } }
}
function renderMsg(html){ $("msg").innerHTML=html+(tried.length?`<div class="tried">${tried.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""); }
$("bar").onsubmit=e=>{ e.preventDefault(); if(answered) return;
  const inp=$("inp"), v=inp.value.trim(), row=$("barrow");
  const shake=()=>{row.classList.remove("err");void row.offsetWidth;row.classList.add("err");};
  if(!v){shake();return;}
  const r=check(curQ(),v);
  if(!r){ tried.push(v); pending=null; shake(); SFX.wrong(); if(SET.clear) inp.value=""; else inp.select();
    renderMsg(`<div class="pill bad">«${esc(v)}» ble ikke godkjent – prøv igjen!</div>`); return; }
  // Én bokstav feil i et langt svar godtas direkte; ellers spør vi «mente du …?» og Enter én gang til bekrefter
  if(!r.exact && SET.corr && pending!==norm(v) && !autoOK(r,v)){ pending=norm(v);
    renderMsg(`<div class="pill sug" id="sug">«${esc(v)}» → <b>${esc(r.a.label)}</b>?<small>Trykk Enter eller Dykk igjen for å bekrefte – eller rett svaret</small></div>`);
    $("sug").onclick=()=>accept(r.a); SFX.count(); return; }
  accept(r.a);
};
$("inp").addEventListener("input",()=>{ if(pending&&norm($("inp").value)!==pending){pending=null;renderMsg("");} $("barrow").classList.remove("err"); });
$("skip").onclick=()=>{ if(!answered) accept(null,"pass"); };

function accept(hit,reason){
  if(answered) return; answered=true; clearInterval(timerH); $("inp").blur();
  const q=curQ(), tier=hit?hit.tier:-1, pts=hit?TIERS[tier].pts:0;
  game.results.push({id:q.id,q:q.q,label:hit?hit.label:null,tier,pts,reason:reason||null,tried:tried.slice()});
  setState("diving");
  if(hit){
    $("tag").textContent="«"+hit.label+"»"; $("tag").classList.add("show");
    $("diver").classList.add("dive"); SFX.dive();
    const T=TIERS[tier], meters=T.m, fromD=depthOf(game)-meters, from=game.score;
    const dur=[1300,1700,2200,2800,3400,4300][tier];
    game.score+=pts; game.depth=depthOf(game);
    const target=BASE+game.depth;
    if(tier>=4){ diveTo(target,dur,easeBack); } else diveTo(target,dur,easeDive);
    fx.start(tier,dur);
    countUp($("hDepth"),fromD,game.depth,dur," m"); countUp($("hScore"),from,game.score,dur);
    bigDepthRun(meters,dur,T.color,tier);
    setTimeout(()=>{$("diver").classList.remove("dive");$("tag").classList.remove("show");fx.arrive(tier);showReveal();},dur+120);
  } else { SFX.miss(); setTimeout(showReveal,500); }
}

function showReveal(){
  const q=curQ(), r=game.results[game.i], all=parse(q);
  if(game.mode==="endless"&&r.tier<0) game.lives--;
  const last=game.mode==="endless"?game.lives<=0:game.i===game.rounds-1;
  const common=all.filter(a=>a.tier===0).slice(0,4).map(a=>a.label);
  const rare=shuffle(all.filter(a=>a.tier>=4&&a.label!==r.label),Math.random).slice(0,5);
  let top;
  if(r.tier>=0){ const t=TIERS[r.tier];
    top=`<div style="--tc:${t.color}">
      <div class="ricon"><div class="glow"></div><div class="burst"></div><div class="burst b2"></div>${ICONS[r.tier]}</div>
      <div class="tname${t.name.length>12?" long":""}">${t.name.toUpperCase()}</div>
      <div class="rword">${t.desc} svar</div>
      <div class="rquote">«${esc(r.label)}»</div>
      <div class="rmeta">+${t.pts} p <span>· sank ${fmt(t.m)} m</span></div>
      <div class="rbar">${TIERS.map((x,k)=>`<i style="${k<=r.tier?`background:${t.color};box-shadow:0 0 10px ${t.color};animation-delay:${k*.08}s`:""}"></i>`).join("")}</div>
      <div class="rscale"><span>Vanlig</span><span>Sjeldent</span></div>
      <div class="flavor">${t.flavor}</div></div>`;
    SFX.tier(r.tier);
  } else {
    top=`<div style="--tc:#ff7a6b"><div class="ricon"><div class="burst"></div>
      <svg viewBox="0 0 64 64" fill="none" stroke="#ff7a6b" stroke-width="3" stroke-linecap="round"><circle cx="32" cy="32" r="22" stroke-dasharray="5 6"/><path d="M24 24l16 16M40 24 24 40"/></svg></div>
      <div class="tname">${r.reason==="pass"?"HOPPET OVER":"TIDEN ER UTE"}</div>
      <div class="rmeta">+0 p <span>· ${game.mode==="endless"?`du mistet et liv (${game.lives} igjen)`:"du ble liggende"}</span></div>
      <div class="flavor">${r.tried.length?`Ikke godkjent: ${r.tried.map(esc).join(", ")}`:"Neste gang – skriv hva som helst som passer!"}</div></div>`;
  }
  $("reveal").innerHTML=top+`
    <div class="sect">Vanligste svar</div><div class="chips">${common.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="sect">Sjeldne svar du kunne gitt</div><div class="chips">${rare.map(a=>`<span class="chip" style="border-color:${TIERS[a.tier].color}66;color:${TIERS[a.tier].color}">${esc(a.label)}</span>`).join("")}</div>
    <button class="btn btn-primary" id="next">${last?"Fullfør dykket":"Dykk videre <span class='arrow'>▼</span>"}</button>`;
  renderPips(); setState("reveal");
  const nx=$("next"); $("reveal").scrollTop=0; setTimeout(()=>nx.focus({preventScroll:true}),300);
  // Uendelig: hent neste spørsmål i bakgrunnen mens spilleren leser resultatet, så «Dykk videre» svarer med en gang
  if(!last&&game.mode==="endless"&&game.i+1>=game.qs.length&&!game._next){
    game._next=(async()=>{ let q2=randomQ(game.qs.slice(-25));
      if(!(await ensureLoaded(q2))) q2=QUESTIONS.find(x=>!x.src&&!game.qs.includes(x.id))||QUESTIONS[0]; return q2; })(); }
  nx.onclick=async()=>{ if(last) return finish();
    if(game.mode==="endless"&&game.i+1>=game.qs.length){ nx.disabled=true; const t=setTimeout(()=>{nx.textContent="Henter neste …";},250);
      const q2=await (game._next||Promise.resolve(QUESTIONS[0])); clearTimeout(t); game._next=null;
      game.qs.push(q2.id); }
    game.i++; nextQ(); };
}

function finish(){
  if(game.mode==="archive") store.set("dypdykk-arkiv-"+game.date,{score:game.score,results:game.results,date:game.date,day:game.day});
  if(game.mode==="pack"&&typeof packDone==="function") packDone(game);
  if(game.mode==="endless"){ const b=store.get("dypdykk-endless-best")||0; if(game.score>b) store.set("dypdykk-endless-best",game.score); }
  if(game.daily){ store.set("dypdykk-"+game.date,game);
    const st=store.get("dypdykk-stats")||{}; const y=new Date();y.setDate(y.getDate()-1);
    const yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    st.streak=(st.lastDaily===yk?(st.streak||0)+1:1); st.lastDaily=game.date; st.bestStreak=Math.max(st.bestStreak||0,st.streak); store.set("dypdykk-stats",st); }
  const st=store.get("dypdykk-stats")||{}; st.played=(st.played||0)+1; st.best=Math.max(st.best||0,game.score); store.set("dypdykk-stats",st);
  showSummary(false);
}

function shareText(){
  const sq=["⬜","🟧","🟦","🟪","🟨","🟩"];
  const what=game.mode==="daily"?"nr. "+game.day:game.mode==="archive"?"nr. "+game.day+" (arkiv)":game.mode==="endless"?"uendelig":game.mode==="pack"?`${game.packName||"temapakke"} kap. ${game.chapter}`:"(øving)";
  const link=(typeof SET!=="undefined"&&SET.link)?"\n"+(location.origin&&location.origin.startsWith("http")?location.origin+"/":"https://dypdykk.netlify.app/"):"";
  return `Dypdykk ${what} 🤿\n${game.results.map(r=>r.tier<0?"⬛":sq[r.tier]).join("")}\n${fmt(game.score)} p · ${fmt(depthOf(game))} m${link}`;
}

function logSVG(){
  const cols=game.results.length, Wd=Math.max(700,cols*60), top=26, depth=210;
  let s=`<svg viewBox="0 0 ${Wd} ${top+depth+46}">`;
  for(let k=0;k<=4;k++){const y=top+depth*k/4; s+=`<line x1="40" x2="${Wd-10}" y1="${y}" y2="${y}" stroke="rgba(160,230,255,.1)" stroke-dasharray="${k?"3 5":""}"/>
    <text x="32" y="${y+3}" fill="rgba(160,210,230,.55)" font-family="JetBrains Mono" font-size="10" text-anchor="end">${k*400}</text>`;}
  s+=`<text x="40" y="12" fill="rgba(160,210,230,.6)" font-family="JetBrains Mono" font-size="10" letter-spacing="2">OVERFLATEN</text>`;
  game.results.forEach((r,i)=>{ const x=80+i*((Wd-110)/(cols-1||1)), y=top+depth*((r.tier>=0?TIERS[r.tier].m:0)/1600), c=r.tier>=0?TIERS[r.tier].color:"#ff7a6b", dl=(.25+i*.18);
    s+=`<line class="drop" x1="${x}" x2="${x}" y1="${top}" y2="${y}" stroke="${c}" stroke-width="2.5" stroke-linecap="round" style="animation-delay:${dl}s;filter:drop-shadow(0 0 6px ${c})"/>`;
    if(r.tier>=0) s+=`<image class="dropicon" href="data:image/svg+xml,${encodeURIComponent(ICONS[r.tier].replace("<svg ","<svg xmlns='http://www.w3.org/2000/svg' "))}" x="${x-18}" y="${y-18}" width="36" height="36" style="animation-delay:${dl+.8}s;transform-origin:${x}px ${y}px"/>`;
    else s+=`<circle class="dropicon" cx="${x}" cy="${y+4}" r="8" fill="none" stroke="#ff7a6b" stroke-dasharray="3 3" style="animation-delay:${dl+.8}s;transform-origin:${x}px ${y}px"/>`;
    s+=`<text x="${x}" y="${top+depth+34}" fill="rgba(200,230,240,.7)" font-family="JetBrains Mono" font-size="11" text-anchor="middle">${i+1}</text>`;});
  return s+`</svg>`;
}

function showSummary(fromStart){
  clearInterval(timerH);
  if(fromStart){ $("hDepth").textContent=fmt(depthOf(game))+" m"; $("hScore").textContent=fmt(game.score); diverYTo(.34,1400); diveTo(BASE+depthOf(game),3200); renderPips(); }
  const eq=game.results.length?game.score*7/Math.max(7,game.results.length):0;
  const rank=[...RANKS].reverse().find(r=>(game.mode==="endless"?eq:game.score)>=r[0]);

  $("summary").innerHTML=`<div class="sum">
    <div class="kicker">${{daily:"Dykk nr. "+game.day+" fullført",archive:"Arkivdykk nr. "+game.day+" fullført",endless:"Uendelig dykk – tom for liv",pack:(game.packName||"Temapakke")+" · kapittel "+game.chapter+" fullført"}[game.mode]||"Øvingsdykk fullført"}</div>
    <div class="bignum"><b id="sumScore">0</b><span>${game.mode==="endless"?`på ${game.results.length} spørsmål`:`/ ${game.results.length*100} p`}</span><em>−${fmt(depthOf(game))} m</em></div>
    ${game.packMsg?`<div class="banner" style="margin:10px 0 0">${game.packMsg}</div>`:""}
    <div class="rank">${rank[1]}</div><p>${rank[2]}</p>
    <div class="panel glass" id="log"><h3>Dykkelogg · dypere = sjeldnere</h3>${logSVG()}</div>
    ${summaryExtras()}
    <div class="panel glass"><h3>Dine rekorder</h3><div class="records">
      <div><b>${fmt(st.best||game.score)}</b><span>Beste poeng</span></div><div><b>${st.played||1}</b><span>Dykk tatt</span></div><div><b>${st.streak||0}</b><span>Dager på rad</span></div></div></div>
    <div class="panel glass"><h3>Del resultatet</h3><div class="share" id="share">${esc(shareText())}</div>
      <div class="btnrow"><button class="btn btn-primary" id="copy">Kopier resultatet</button></div></div>
    <div class="btnrow"><button class="btn btn-ghost" id="again">${game.mode==="endless"?"Dykk uendelig igjen":game.mode==="pack"?"Tilbake til pakken":"Nytt øvingsdykk"}</button><button class="btn btn-ghost" id="home">▲ Til overflaten</button></div>
  </div>`;
  setState("summary"); $("summary").scrollTop=0; initSummaryExtras();
  countUp($("sumScore"),0,game.score,1400);
  $("copy").onclick=async()=>{ try{await navigator.clipboard.writeText(shareText());toast("Kopiert!");}
    catch(e){const r=document.createRange();r.selectNodeContents($("share"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Marker og kopier teksten");} };
  $("again").onclick=()=>{ if(game.mode==="endless") begin("endless"); else if(game.mode==="pack") location.hash="pakke-"+game.pack; else begin(false); };

}

/* ---------- Effekter: risting, lysglimt, stor dybdeteller ---------- */
const fx={
  shake(power,ms){ if(SET.lite) power*=.5; const k=[];const n=Math.round(ms/40);
    for(let i=0;i<=n;i++){const f=power*(1-i/n);k.push({transform:`translate(${(Math.random()*2-1)*f}px,${(Math.random()*2-1)*f}px) rotate(${(Math.random()*2-1)*f*.06}deg)`});}
    k.push({transform:"none"}); document.body.animate(k,{duration:ms,easing:"linear"}); },
  flash(col,strength,ms){ const f=$("flash"); f.style.setProperty("--fc",col); f.animate([{opacity:strength},{opacity:0}],{duration:ms,easing:"ease-out"}); },
  burst(n,spread){ for(let i=0;i<n;i++) bubbles.push({x:W/2+(Math.random()*2-1)*spread,d:cam.d+(Math.random()*60-30),r:2+Math.random()*6,w:Math.random()*6.28}); },
  start(tier,dur){
    fx.burst(10+tier*8,30+tier*12);
    if(tier>=3) fx.flash(TIERS[tier].color,.18+tier*.04,500);
    if(tier===5){ fx.shake(6,dur*.5); setTimeout(()=>fx.shake(10,dur*.35),dur*.5); SFX.rumble(dur); }
    else if(tier===4){ setTimeout(()=>fx.shake(4,600),dur*.55); }
  },
  arrive(tier){
    if(tier===5){ fx.flash("#5ef2d6",.75,1100); fx.shake(18,900); fx.burst(60,160); SFX.boom(); }
    else if(tier===4){ fx.flash("#ffd36b",.45,800); fx.shake(9,550); fx.burst(30,90); }
    else if(tier===3){ fx.shake(4,350); fx.burst(16,60); }
  }
};
SFX.rumble=ms=>{tone(70,ms/1000,"sawtooth",.035,40);tone(110,ms/1000,"sine",.05,55);};
SFX.boom=()=>{tone(90,1.2,"sine",.22,30);tone(180,.6,"triangle",.08,60);tone(1320,1.6,"sine",.05,null,.15);tone(1760,2,"sine",.03,null,.3);};
function bigDepthRun(meters,dur,col,tier){
  const el=$("bigDepth"), n=el.querySelector(".bd-n"); el.classList.remove("done"); el.style.setProperty("--bc",col);
  el.classList.add("on"); countUp(n,0,meters,dur*.95,"");
  setTimeout(()=>{el.classList.add("done");},dur*.95);
  setTimeout(()=>{el.classList.remove("on","done");},dur+200);
}

function inGame(){return /s-(intro|countdown|answer|diving|reveal)/.test(document.body.className);}
function go(id){
  if(id==="dagens"){ location.hash=""; const done=store.get("dypdykk-"+todayKey()); if(done){game=done;showSummary(true);} else begin(true); return; }
  if(id==="ovelse"){ location.hash=""; begin(false); return; }
  if(id==="foresla"){ go("hjelp"); setTimeout(()=>{const el=$("forslag");if(el)el.scrollIntoView({behavior:"smooth"});},400); return; }
  if(id==="garderobe"){ go("mitt-dypdykk"); return; }
  if(location.hash!=="#"+id) location.hash=id; else route();
}
function route(){
  const h=location.hash.replace("#","");
  if(!h){ if(document.body.classList.contains("s-page")&&!window.__starting) startScreen(); return; }
  if(inGame()) return; closeMenu();
  const r=PAGES[h.startsWith("pakke-")?"pakke":h]; if(!r) return;
  clearInterval(timerH); diverYTo(.6,1400); diveTo(0,1800);
  $("page").innerHTML=r(h); setState("page"); $("page").scrollTop=0;
  $("page").querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{location.hash="";});
  if(PAGE_INIT[h.startsWith("pakke-")?"pakke":h]) PAGE_INIT[h.startsWith("pakke-")?"pakke":h](h);
}
addEventListener("hashchange",route);

function summaryExtras(){
  const catchHTML=game.results.map((r,i)=>{ const q=QUESTIONS.find(x=>x.id===r.id); const all=q?parse(q):[];
    return `<details class="acc"><summary><span class="ci">${r.tier>=0?ICONS[r.tier]:`<span class="miss" style="display:block;width:28px;height:28px;border-radius:50%;border:1.5px dashed rgba(255,122,107,.6)"></span>`}</span>
      <span class="qq">${i+1}. ${esc(r.q)}<small style="color:${r.tier>=0?TIERS[r.tier].color:"#ff7a6b"}">${r.label?esc(r.label)+" · "+TIERS[r.tier].name:(r.reason==="pass"?"Hoppet over":"Tiden gikk ut")} · +${r.pts} p</small></span></summary>
      <div class="ab"><p style="margin:0 0 10px;color:var(--muted);font-size:12.5px">Godkjente svar (${fmt(all.length)}), fra sjeldnest til vanligst.${q&&q.attr?" "+esc(q.attr)+".":""} Andel spillere per svar ${soonInline}</p>
      <div class="tierlist">${[5,4,3,2,1,0].map(t=>{const as=all.filter(a=>a.tier===t); if(!as.length) return "";
        return `<div><div class="th" style="color:${TIERS[t].color}"><b style="font-family:var(--head);font-size:16px;letter-spacing:.04em">${TIERS[t].name}</b> <span style="opacity:.7">· ${TIERS[t].desc} · ${TIERS[t].pts} p</span></div><div class="chips">${(()=>{const me=as.find(a=>a.label===r.label), lim=40, shown=as.slice(0,lim); if(me&&!shown.includes(me)) shown.push(me);
          return shown.map(a=>`<span class="chip${a===me?" me":""}" style="${a===me?`color:${TIERS[t].color}`:""}">${esc(a.label)}</span>`).join("")+(as.length>shown.length?`<span class="chip" style="opacity:.6">+ ${fmt(as.length-shown.length)} flere</span>`:"");})()}</div></div>`;}).join("")}</div></div></details>`;}).join("");
  const curve=`<svg viewBox="0 0 600 150"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ef2d6" stop-opacity=".6"/><stop offset="1" stop-color="#5ef2d6" stop-opacity="0"/></linearGradient></defs>
    <path d="M0 140 C80 138 140 120 200 70 S280 10 320 30 S420 120 600 138 L600 150 L0 150Z" fill="url(#cg)"/><path d="M0 140 C80 138 140 120 200 70 S280 10 320 30 S420 120 600 138" fill="none" stroke="#5ef2d6" stroke-width="2"/>
    <line x1="${clamp(game.score/700,0,1)*600}" x2="${clamp(game.score/700,0,1)*600}" y1="10" y2="150" stroke="#ff7a6b" stroke-width="2" stroke-dasharray="4 4"/></svg>`;
  const rated=store.get("dypdykk-rating-"+(game.daily?game.date:"x"));
  return `
    <div class="panel glass"><h3>Sammenlign med andre ${soonInline}</h3><div class="ghostcurve">${curve}<div class="over">Her ser du hvordan du gjorde det mot alle andre som dykket i dag,<br>når Dypdykk har nok spillere.</div></div></div>
    <div class="panel glass"><h3>Fangsten · trykk på et spørsmål for å se alle svar</h3>${catchHTML}</div>
    ${game.daily?`<div class="panel glass" style="text-align:center"><h3>Neste dagens dykk om</h3><div class="countdown2" id="nextDive">--:--:--</div></div>`:""}
    <div class="panel glass promo">${BOMB}<div><b>Boblebomben ${soonInline}</b><p>Flerspiller i sanntid: svar og send boblen videre før den sprekker.</p><button class="btn btn-ghost" onclick="location.hash='boblebomben'" style="padding:10px 18px;font-size:14px">Se lobbyen →</button></div></div>
    <div class="panel glass"><h3>Hvordan var dykket?</h3><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button data-r="${n}" class="${rated===n?"on":""}">${n}</button>`).join("")}</div>
      <p class="psub" style="font-size:12px;margin:10px 0 0">1 = kjedelig · 5 = kjempegøy</p></div>
    <div class="btnrow" style="margin-bottom:12px"><button class="btn btn-ghost" onclick="location.hash='temapakker'">Temapakker →</button><button class="btn btn-ghost" onclick="location.hash='arkiv'">Arkiv ↺</button></div>`;
}
let nextH=null;
function initSummaryExtras(){
  clearInterval(nextH);
  if($("nextDive")){ const upd=()=>{const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);let s=Math.max(0,Math.floor((m-n)/1000));
    const el=$("nextDive"); if(!el){clearInterval(nextH);return;} el.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,"0")).join(":");};
    upd(); nextH=setInterval(upd,1000); }
  $("stars").querySelectorAll("button").forEach(b=>b.onclick=()=>{ $("stars").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    store.set("dypdykk-rating-"+(game.daily?game.date:"x"),+b.dataset.r); SFX.count(); toast("Takk for vurderingen!"); });
}

/* ---------- Temapakker ---------- */
const PACK_RULES={
  ord:   q=>["gresk","sprakfamilie","dodssynder","apostler","norrone","romersk","egyptisk","programmering","valuta","vitamin","stjernetegn","kinesisk","guder"].includes(q.id),
  film:  q=>q.cat==="Underholdning"||["brettspill"].includes(q.id),
  sport: q=>q.cat==="Sport",
  geo:   q=>q.cat==="Geografi",
  musikk:q=>["artister","norske-artister","band","norske-band","sanger","orkester","korps","instrumenter","komponister","sjanger","radiokanal"].includes(q.id),
  norge: q=>!!q.norsk
};
const PACK_MIN=150, PACK_SIZE=7;
function packPool(id){ return QUESTIONS.filter(PACK_RULES[id]||(()=>false)).sort((a,b)=>a.id<b.id?-1:1); }
function packReady(id){ return packPool(id).length>=PACK_SIZE; }
function packChapter(id,c){ const pool=shuffle(packPool(id),rng(id.length*977+13)); const out=[];
  for(let j=0;out.length<PACK_SIZE&&j<pool.length*2;j++){ const q=pool[((c-1)*PACK_SIZE+j)%pool.length]; if(!out.includes(q)) out.push(q); }
  return shuffle(out,rng(c*101+id.length)); }
function packProg(id){ return store.get("dypdykk-pack-"+id)||{done:{}}; }
function packUnlocked(id,c){ if(c===1) return true; const d=packProg(id).done[c-1]; return d!=null&&d>=PACK_MIN; }
function packDone(g){ const pr=packProg(g.pack); const prev=pr.done[g.chapter]; pr.done[g.chapter]=Math.max(prev||0,g.score);
  store.set("dypdykk-pack-"+g.pack,pr);
  const passed=g.score>=PACK_MIN;
  g.packMsg=passed?(g.chapter<30?`Kapittel ${g.chapter+1} er låst opp!`:"Du har fullført hele pakken!")
                  :`Du trenger minst ${PACK_MIN} p for å låse opp neste kapittel. Prøv igjen!`;
  if(passed&&[10,20,30].includes(g.chapter)){ const ex=store.get("dypdykk-buddies-extra")||[]; const b=["Sjøstjerna","Hvalen","Tarekongen"][g.chapter/10-1];
    if(!ex.includes(b)){ ex.push(b); store.set("dypdykk-buddies-extra",ex); g.packMsg+=` Ny dykkekompis: ${b}!`; } }
}
function startChapter(id,c){ const p=PACKS.find(x=>x.id===id); location.hash="";
  setTimeout(()=>begin("pack",{set:packChapter(id,c),pack:id,chapter:c,packName:p.name}),50); }

PAGES.temapakker=()=>head("Temapakker","Reiser utover dagens dykk. Hver pakke har 30 kapitler med sju spørsmål innenfor ett tema.")+

    return `<button class="pack" style="--pc:${p.col}" data-pack="${p.id}">
     <div class="art">${p.art}${ready?"":SOON}</div><div class="body"><span class="tag2">${p.tag}</span><b>${p.name}</b>
     <small>${ready?`${packPool(p.id).length} spørsmål · ${done}/30 kapitler fullført`:p.desc}</small><span class="cta">${ready?"ÅPNE PAKKEN →":"SE KAPITLENE →"}</span></div></button>`;}).join("")}</div>
  <div class="panel glass" style="margin-top:16px"><h3>Slik fungerer det</h3><ol class="steps"><li>Hvert kapittel er et dykk med sju spørsmål fra temaet.</li><li>Nå minst ${PACK_MIN} p for å låse opp neste kapittel.</li><li>Kapittel 10, 20 og 30 gir nye dykkekompiser.</li></ol></div></div>`;

   `<div class="legend"><span><i style="background:${p.col}"></i>Åpent</span><span><i style="background:#5ef2d6"></i>Fullført</span><span><i style="background:rgba(255,255,255,.18)"></i>Låst</span><span><i style="background:#ffd36b"></i>Milepæl</span></div>

     ${nodes.map(n=>{const c=n.i+1, mile=c%10===0, sc=pr.done[c], fin=sc!=null&&sc>=PACK_MIN, open=ready&&packUnlocked(p.id,c);

function encodeResult(g){ const o={d:g.day,s:g.score,t:g.results.map(r=>r.tier<0?"x":r.tier).join(""),n:myName()||"Venn"};
  return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function decodeResult(c){ try{ c=c.trim().replace(/^.*[?&]venn=/,"").replace(/-/g,"+").replace(/_/g,"/"); const o=JSON.parse(decodeURIComponent(escape(atob(c))));
  if(typeof o.d==="number"&&typeof o.s==="number"&&/^[0-5x]{1,7}$/.test(o.t)&&o.s>=0&&o.s<=700) return {d:o.d,s:o.s,t:o.t,n:String(o.n||"Venn").slice(0,24)}; }catch(e){} return null; }
function addFriend(r){ const l=store.get("dypdykk-venner")||[]; const i=l.findIndex(x=>x.n===r.n&&x.d===r.d); if(i>=0) l[i]=r; else l.push(r); store.set("dypdykk-venner",l); }

function partyStart(players,net){
  pg={players:players.map(p=>({...p,lives:PARTY.lives,ans:0,rare:0})),turn:0,round:0,log:[],net:!!net};
  partyRound(); }
// Velger og laster et spørsmål. Neste runde hentes i bakgrunnen mens denne spilles, så det blir ingen pause mellom rundene.
async function partyPick(avoid){ const pool=partyQuestions(); let q=null;
  for(let t=0;t<8&&!q;t++){ const c=pool[Math.floor(Math.random()*pool.length)]; if(avoid&&avoid.has(c.id)&&t<6) continue; if(await ensureLoaded(c)) q=c; }
  return q||QUESTIONS.find(x=>!x.src); }
async function partyRound(){
  const mine=pg; pg.seen=pg.seen||new Set();
  const q=await (pg._next||partyPick(pg.seen)); if(pg!==mine) return; pg._next=null; pg.seen.add(q.id);
  pg._next=partyPick(pg.seen);
  parse(q); pg.q=q; pg.used=new Set(); pg.round++; pg.pressure=0; pg.fuse=100+Math.random()*200; pg.answers=[];
  while(pg.players[pg.turn].lives<=0) pg.turn=(pg.turn+1)%pg.players.length;
  partyRender(); clearInterval(pgTimer); pgTimer=setInterval(partyTick,100); partyTurnStart(); }
function partyAlive(){ return pg.players.filter(p=>p.lives>0); }
function partyRender(msg){
  const cur=pg.players[pg.turn], s=1+Math.min(pg.pressure/300,1)*.9;
  $("page").innerHTML=`<div class="pg narrow" style="text-align:center"><button class="back" id="pQuit">← Avslutt Boblebomben</button>
    <div class="kicker" style="color:var(--cyan)">Runde ${pg.round} · Boblebomben</div>
    <div class="ptitle" style="font-size:clamp(26px,6vw,40px)">${esc(pg.q.q)}</div>
    <div style="height:210px;display:grid;place-items:center"><div id="pBomb" style="width:150px;height:150px;transform:scale(${s});transition:transform .15s">${BOMB}</div></div>
    <div class="banner" style="justify-content:center;background:rgba(94,242,214,.08);border-color:rgba(94,242,214,.35);color:#dffcf6">${cur.bot?"🤖 ":cur.id?"🌐 ":""}<b>${esc(cur.n)}</b>&nbsp;har boblen${cur.bot?" … tenker":cur.id?" … skriver":""}</div>
    ${cur.bot||cur.id?"":`<form id="pForm" class="barrow glass" style="margin:0 auto 10px;max-width:520px" autocomplete="off"><input id="pInp" class="field" style="border:0;background:transparent;font-size:18px" placeholder="Skriv et svar …" autocapitalize="off" spellcheck="false"><button id="go" type="submit">SEND ▶</button></form>`}
    <div id="pMsg" style="min-height:24px;font-size:14px;color:#ffc2ba">${msg||""}</div>

}
function partyTick(){ if(!pg) return clearInterval(pgTimer); pg.pressure+=1; const b=$("pBomb");
  if(b) b.style.transform=`scale(${1+Math.min(pg.pressure/300,1)*.9}) rotate(${Math.sin(pg.pressure/3)*(pg.pressure/pg.fuse)*6}deg)`;

// «from» er nettverks-ID-en til en spiller i en online-lobby (tom for spillere på denne enheten og boter)
function partySubmit(v,from){ if(!pg) return; v=(v||"").trim(); if(!v) return;
  const r=check(pg.q,v), cur=pg.players[pg.turn];
  if((from||null)!==(cur.id||null)) return;   // bare den som har boblen kan svare
  const say=m=>{ if(from) NET.to(from,{t:"msg",m}); else { SFX.wrong(); partyMsg(m); } };
  if(!r) return say(`«${esc(v)}» ble ikke godkjent`);
  if(!r.exact&&SET.corr!==false) return say(`Mente du «${esc(r.a.label)}»? Skriv det, så teller det.`);
  if(pg.used.has(r.a)) return say(`«${esc(r.a.label)}» er allerede brukt`);
  pg.used.add(r.a); pg.answers.push(r.a); cur.ans++; if(r.a.tier>=4) cur.rare++;
  pg.pressure=Math.max(0,pg.pressure-(10+r.a.tier*9)); SFX.tier(r.a.tier);
  partyNext(); }
function partyMsg(m){ const el=$("pMsg"); if(el){ el.innerHTML=m; const f=$("pForm"); if(f){f.classList.remove("err");void f.offsetWidth;f.classList.add("err");} const i=$("pInp"); if(i){i.value="";i.focus();} } }
function partyNext(){ do{ pg.turn=(pg.turn+1)%pg.players.length; }while(pg.players[pg.turn].lives<=0); partyRender(); partyTurnStart(); }
function partyTurnStart(){ const cur=pg.players[pg.turn]; if(!cur.bot) return;
  const r0=pg.round, t0=pg.turn, delay=1200+Math.random()*2800;
  setTimeout(()=>{ if(!pg||pg.round!==r0||pg.turn!==t0) return;
    const all=parse(pg.q).filter(a=>!pg.used.has(a)); if(!all.length||Math.random()<.06) return;   // boten står fast av og til
    const w=all.map(a=>Math.pow(.45,a.tier)); let x=Math.random()*w.reduce((s,v)=>s+v,0), pick=all[0];
    for(let i=0;i<all.length;i++){ x-=w[i]; if(x<=0){ pick=all[i]; break; } }
    partySubmit(pick.label); },delay); }
function partyPop(){ clearInterval(pgTimer); const cur=pg.players[pg.turn]; cur.lives--; SFX.boom(); fx.flash("#ff7a6b",.6,700); fx.shake(14,600);
  if(pg.net) NET.all({t:"pop",n:cur.n});

  const box=$("page").querySelector(".pg"); if(box) box.insertAdjacentHTML("afterbegin",`<div class="banner" style="justify-content:center;font-size:16px">💥 Boblen sprakk hos <b>&nbsp;${esc(cur.n)}</b>!</div>`);
  setTimeout(()=>{ if(!pg) return; if(alive.length<=1) partyEnd(alive[0]); else { pg.turn=(pg.turn+1)%pg.players.length; partyRound(); } },1800); }
function partyEnd(winner){ const ps=[...pg.players].sort((a,b)=>b.lives-a.lives||b.ans-a.ans);

    <div class="panel glass" style="text-align:left"><h3>Resultat</h3><ul class="lb">${ps.map((p,i)=>`<li><span class="pos">${i+1}</span><span class="nm">${esc(p.n)}</span><span class="sc">${p.ans} svar</span><span class="sc" style="color:#ffd36b">${p.rare} sjeldne</span></li>`).join("")}</ul></div>
    <div class="btnrow"><button class="btn btn-primary" id="pAgain">Spill igjen</button><button class="btn btn-ghost" id="pBack">Til oppsett</button></div></div>`;

/* ---------- Boblebomben over nettet: lobby med kode ----------
   Verten (den som lager lobbyen) kjører spillet og sjekker alle svar. De andre kobles direkte til verten
   (WebRTC via PeerJS) og sender bare inn svar. Ingen egen server eller lagring trengs. */
const NET={peer:null,conns:new Map(),host:false,code:"",hostConn:null,me:"",lobby:[],
  all(m){ for(const c of this.conns.values()) if(c.open) c.send(m); },
  to(id,m){ const c=this.conns.get(id); if(c&&c.open) c.send(m); },
  state(msg){ if(!pg) return; const cur=pg.players[pg.turn];
    this.all({t:"state",q:pg.q.q,round:pg.round,turn:pg.turn,turnId:cur.id||"",msg:msg||"",p:pg.pressure,
      players:pg.players.map(p=>({n:p.n,lives:p.lives,ans:p.ans,bot:!!p.bot,gone:!!p.gone,id:p.id||""})),
      answers:pg.answers.slice(-30).map(a=>[a.label,a.tier]),count:pg.answers.length}); },
  close(){ try{ this.all({t:"bye"}); }catch(e){} try{ this.peer&&this.peer.destroy(); }catch(e){}
    this.peer=null; this.conns.clear(); this.host=false; this.hostConn=null; this.lobby=[]; }
};
const NET_ABC="ABCDEFGHJKMNPQRSTUVWXYZ23456789", NET_PREFIX="dypdykk-boble-";
function netCode(){ let s=""; for(let i=0;i<5;i++) s+=NET_ABC[Math.floor(Math.random()*NET_ABC.length)]; return s; }
let _peerLib=null;
function loadPeer(){ return _peerLib||(_peerLib=new Promise((ok,bad)=>{ if(window.Peer) return ok();
  const s=document.createElement("script"); s.src="peerjs.min.js"; s.onload=()=>ok(); s.onerror=()=>{ _peerLib=null; bad(new Error("lib")); };
  document.head.appendChild(s); })); }
function netErr(e){ const t=(e&&e.type)||"";
  return t==="peer-unavailable"?"Fant ingen lobby med den koden. Sjekk koden og at verten fortsatt har lobbyen åpen."
    :t==="unavailable-id"?"Koden var opptatt – prøv igjen."
    :t==="network"||t==="server-error"||t==="socket-error"?"Fikk ikke kontakt med koblingstjenesten. Sjekk nettet og prøv igjen."
    :t==="browser-incompatible"?"Nettleseren støtter ikke direkte tilkobling."
    :"Tilkoblingen feilet. Noen nettverk (f.eks. strenge bedriftsnett) stopper direkte tilkobling."; }

/* ----- Vert ----- */
async function netHostStart(name,tries){ netSay("Lager lobby …");
  try{ await loadPeer(); }catch(e){ return netSay("Kunne ikke laste tilkoblingsmodulen. Sjekk nettet."); }
  NET.close(); const code=netCode(); const peer=new Peer(NET_PREFIX+code,Object.assign({debug:0},window.DYPDYKK_PEER||{}));
  NET.peer=peer; NET.host=true; NET.code=code; NET.lobby=[{n:name,id:""}];
  peer.on("open",()=>{ ac(); netLobbyRender(); });
  peer.on("error",e=>{ if(e.type==="unavailable-id"&&(tries||0)<3) return netHostStart(name,(tries||0)+1);
    if(e.type==="peer-unavailable") return; netSay(netErr(e)); if(!NET.lobby.length||!$("netLobby")) return; toast(netErr(e)); });
  peer.on("disconnected",()=>{ try{ peer.reconnect(); }catch(e){} });   // mister bare koblingstjenesten; spillere er fortsatt tilkoblet
  peer.on("connection",conn=>{
    conn.on("open",()=>{ const n=String((conn.metadata&&conn.metadata.n)||"Gjest").slice(0,16);
      if(pg){ conn.send({t:"full",m:"Spillet er allerede i gang. Vent til neste runde."}); setTimeout(()=>conn.close(),500); return; }
      if(NET.lobby.length>=8){ conn.send({t:"full",m:"Lobbyen er full (8 spillere)."}); setTimeout(()=>conn.close(),500); return; }
      let nn=n, k=2; while(NET.lobby.some(p=>p.n.toLowerCase()===nn.toLowerCase())) nn=n.slice(0,13)+" "+(k++);
      NET.conns.set(conn.peer,conn); NET.lobby.push({n:nn,id:conn.peer}); SFX.bubble&&SFX.bubble(); netLobbySync(); });
    conn.on("data",d=>netHostData(conn.peer,d));
    conn.on("close",()=>netGone(conn.peer)); conn.on("error",()=>netGone(conn.peer)); }); }
function netGone(id){ if(!NET.conns.has(id)) return; NET.conns.delete(id);
  const i=NET.lobby.findIndex(p=>p.id===id); const who=i>=0?NET.lobby[i].n:"En spiller"; if(i>=0) NET.lobby.splice(i,1);
  if(pg&&pg.net&&!$("pAgain")){ const p=pg.players.find(x=>x.id===id); if(p&&!p.gone){ p.gone=true; p.lives=0; toast(`${p.n} forlot spillet`);
      const alive=partyAlive(); if(alive.length<=1){ clearInterval(pgTimer); partyEnd(alive[0]); }
      else if(pg.players[pg.turn]===p) partyNext(); else partyRender(); } }
  else if(!pg) netLobbySync(); }
function netHostData(id,d){ if(!d||typeof d!=="object") return;
  if(d.t==="ans"&&pg&&pg.net) partySubmit(String(d.v||"").slice(0,80),id); }
function netLobbySync(){ NET.all({t:"lobby",code:NET.code,players:NET.lobby.map(p=>p.n),lives:PARTY.lives,bots:PARTY.bots}); if($("netLobby")) netLobbyRender(); }
function netLobbyRender(){ if(pg) return; const link=location.origin+location.pathname+"?bli="+NET.code+"#boblebomben";

    <div class="ptitle" style="font-size:clamp(20px,5vw,28px)">Del koden med vennene dine</div>
    <div style="font-size:clamp(46px,14vw,76px);font-weight:800;line-height:1.1;letter-spacing:.18em;margin:10px 0 8px;color:#dffcf6;text-shadow:0 0 30px rgba(94,242,214,.45)">${NET.code}</div>
    <div class="btnrow" style="margin-bottom:14px"><button class="btn btn-ghost" id="nlCopy">Kopier invitasjonslenke</button></div>
    <div class="panel glass" style="text-align:left"><h3>Spillere (${NET.lobby.length + PARTY.bots})</h3><ul class="lb">

let netView=null;
async function netJoin(code,name){ netSay("Kobler til …");
  try{ await loadPeer(); }catch(e){ return netSay("Kunne ikke laste tilkoblingsmodulen. Sjekk nettet."); }
  NET.close(); const peer=new Peer(Object.assign({debug:0},window.DYPDYKK_PEER||{})); NET.peer=peer; NET.code=code; NET.me=name;
  const fail=e=>{ netSay(netErr(e)); if(!$("netPanel")) { toast(netErr(e)); } };
  const timer=setTimeout(()=>{ if(!NET.hostConn||!NET.hostConn.open) fail({type:"timeout"}); },15000);
  peer.on("error",fail);
  peer.on("open",id=>{ NET.myId=id; const conn=peer.connect(NET_PREFIX+code,{metadata:{n:name},reliable:true}); NET.hostConn=conn;
    conn.on("open",()=>{ clearTimeout(timer); ac(); });
    conn.on("data",netClientData);
    conn.on("close",()=>{ if(NET.peer===peer){ const ended=netView&&netView.ended; NET.close(); if(!ended){ toast("Verten avsluttet lobbyen"); netView=null; location.hash="boblebomben"; route(); } } }); }); }
function netClientData(d){ if(!d||typeof d!=="object") return;

  if(d.t==="lobby"){ netView={phase:"lobby",...d}; return netClientLobby(); }
  if(d.t==="start"){ netView={phase:"game"}; return; }
  if(d.t==="state"){ const prev=netView&&netView.phase==="game"&&netView.count; netView={...netView,phase:"game",...d};
    if(prev!==undefined&&prev!==false&&d.count>prev&&d.answers.length) SFX.tier(d.answers[d.answers.length-1][1]);
    return netClientGame(); }
  if(d.t==="p"&&netView){ netView.p=d.p; const b=$("pBomb"); if(b) b.style.transform=`scale(${1+Math.min(d.p/300,1)*.9}) rotate(${Math.sin(d.p/3)*d.w*6}deg)`; return; }
  if(d.t==="msg"){ SFX.wrong(); const el=$("pMsg"); if(el){ el.innerHTML=d.m; const f=$("pForm"); if(f){f.classList.remove("err");void f.offsetWidth;f.classList.add("err");} const i=$("pInp"); if(i){i.value="";i.focus();} } return; }
  if(d.t==="pop"){ SFX.boom(); fx.flash("#ff7a6b",.6,700); fx.shake(14,600);
    const box=$("page").querySelector(".pg"); if(box) box.insertAdjacentHTML("afterbegin",`<div class="banner" style="justify-content:center;font-size:16px">💥 Boblen sprakk hos <b>&nbsp;${esc(d.n)}</b>!</div>`); return; }
  if(d.t==="end"){ netView={...netView,ended:true,phase:"end"}; SFX.tier(5);
    $("page").innerHTML=`<div class="pg narrow" style="text-align:center"><div class="kicker" style="color:var(--cyan)">Boblebomben ferdig etter ${d.round} runder</div>
      <div class="ptitle">🏆 ${esc(d.w)} vant!</div>
      <div class="panel glass" style="text-align:left"><h3>Resultat</h3><ul class="lb">${d.rows.map((r,i)=>`<li><span class="pos">${i+1}</span><span class="nm">${esc(r[0])}</span><span class="sc">${r[1]} svar</span><span class="sc" style="color:#ffd36b">${r[2]} sjeldne</span></li>`).join("")}</ul></div>

function netClientLobby(){ const v=netView;
  $("page").innerHTML=`<div class="pg narrow" style="text-align:center" id="netLobby"><button class="back" id="nlQuit">← Forlat lobbyen</button>
    <div class="kicker" style="color:var(--cyan)">Boblebomben · lobby ${esc(v.code)}</div>
    <div class="ptitle" style="font-size:clamp(22px,5vw,32px)">Du er med! Venter på at verten starter …</div>

      ${v.players.map((n,i)=>`<li><span class="pos">${i?"🌐":"👑"}</span><span class="nm">${esc(n)}${n===NET.me?" (deg)":""}</span></li>`).join("")}

  $("nlQuit").onclick=()=>{ NET.close(); netView=null; route(); }; }
function netClientGame(){ const v=netView, cur=v.players[v.turn], mine=cur&&cur.id===NET.myId, keep=$("pInp")&&mine?$("pInp").value:"";
  $("page").innerHTML=`<div class="pg narrow" style="text-align:center"><button class="back" id="nQuit">← Forlat spillet</button>

/* ---------- Konto: logg inn og lagre dykkene dine på tvers av enheter ----------
   Serveren (netlify/functions/api.mjs) lagrer brukernavn, et kryptert passord og spilldataene dine. Ingen e-post. */
const AUTH_KEY="dypdykk-auth";
const SYNC_RE=/^dypdykk-(\d{4}-\d\d-\d\d|arkiv-\d{4}-\d\d-\d\d|stats|buddy|buddies-extra|name|endless-best|venner|settings|pack-[a-z0-9-]+)$/;
function auth(){ return store.get(AUTH_KEY); }
function localItems(){ const o={}; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(SYNC_RE.test(k)) o[k]=store.get(k); } }catch(e){} return o; }
async function api(path,body,method){ const a=auth(), h={"content-type":"application/json"}; if(a&&a.token) h.authorization="Bearer "+a.token;
  let r; try{ r=await fetch("/api/"+path,{method:method||(body?"POST":"GET"),headers:h,body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error("Fikk ikke kontakt med serveren. Sjekk nettet."); }
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ if(r.status===401&&a&&path!=="login"){ store.set(AUTH_KEY,null); } throw new Error(j.error||"Noe gikk galt ("+r.status+")"); }
  return j; }
// Skriver serverens data inn lokalt. Dykk som bare finnes lokalt, beholdes. Rekken regnes ut på nytt fra datoene.
function applyItems(items){ for(const [k,v] of Object.entries(items||{})){ if(!SYNC_RE.test(k)) continue;
    if(/\d{4}-\d\d-\d\d$/.test(k)&&store.get(k)) continue; store.set(k,v); }
  const days=Object.keys(localItems()).filter(k=>/^dypdykk-\d{4}-\d\d-\d\d$/.test(k)).map(k=>k.slice(8)).sort();
  if(days.length){ const st=store.get("dypdykk-stats")||{}; let best=0,run=0,prev=null;
    for(const d of days){ const t=new Date(d+"T12:00:00"); run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1; best=Math.max(best,run); prev=t; }
    const last=days[days.length-1], y=new Date(); y.setDate(y.getDate()-1); const yk=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
    st.lastDaily=last; st.streak=(last===todayKey()||last===yk)?run:0; st.bestStreak=Math.max(st.bestStreak||0,best);
    st.best=Math.max(st.best||0,...days.map(d=>(store.get("dypdykk-"+d)||{}).score||0)); st.played=Math.max(st.played||0,days.length);
    store.set("dypdykk-stats",st); }
  if(typeof renderBuddy==="function") renderBuddy(); }
let _syncT=null, _syncing=false;
async function syncNow(quiet){ const a=auth(); if(!a||_syncing) return false; _syncing=true;
  try{ const j=await api("save",{items:localItems()}); applyItems(j.items); a.last=new Date().toISOString(); store.set(AUTH_KEY,a); return true; }
  catch(e){ if(!quiet) toast(e.message); return false; } finally{ _syncing=false; } }
function syncSoon(){ clearTimeout(_syncT); _syncT=setTimeout(()=>syncNow(true),800); }

/* Lagre automatisk etter hvert dykk */

/* Arkivdykk lagres nå med hele dykket, slik at resultatet kan vises igjen senere */

PAGE_INIT.konto=()=>{ const msg=(m,ok)=>{ const e=$("kMsg"); if(e){ e.textContent=m; e.style.color=ok?"var(--cyan)":"#ffc2ba"; } };

/* ----- Boblefiguren (egen design: en såpeboble med ansikt som sprekker opp) ----- */
function bbBubbleSVG(p,mood){ p=Math.max(0,Math.min(1,p)); const r=34+p*30, cheek=Math.max(0,(p-.55)/.45), cracks=Math.max(0,(p-.72)/.28), sweat=p>.6;
  const eyeY=78-p*2, worry=p>.7, sleep=mood==="sleep", happy=mood==="happy";
  const crack=(a,l)=>{ const x=80+Math.cos(a)*r*.92, y=86+Math.sin(a)*r*.92, x2=80+Math.cos(a+.15)*(r*.92-l), y2=86+Math.sin(a+.15)*(r*.92-l), x3=80+Math.cos(a-.08)*(r*.92-l*1.6), y3=86+Math.sin(a-.08)*(r*.92-l*1.6);
    return `<polyline points="${x},${y} ${x2},${y2} ${x3},${y3}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="${cracks}"/>`; };
  return `<svg viewBox="0 0 160 160" class="bbsvg"><defs><radialGradient id="bbg" cx=".36" cy=".32"><stop offset="0" stop-color="#e6fdff"/><stop offset=".5" stop-color="${p>.75?"#ffb3c7":"#7fd8f2"}"/><stop offset="1" stop-color="${p>.75?"#c2375e":"#1d6b96"}"/></radialGradient>
    <radialGradient id="bbglow"><stop offset="0" stop-color="${p>.75?"#ff5d7a":"#5ef2d6"}" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
    <circle cx="80" cy="86" r="${r+18}" fill="url(#bbglow)" opacity="${.25+p*.75}"/>
    <ellipse cx="80" cy="${86+r+10}" rx="${r*.7}" ry="5" fill="#000" opacity=".22"/>
    <circle cx="80" cy="86" r="${r}" fill="url(#bbg)" opacity=".93" stroke="#dffcff" stroke-opacity=".5" stroke-width="2"/>
    <ellipse cx="${80-r*.38}" cy="${86-r*.42}" rx="${r*.26}" ry="${r*.15}" fill="#fff" opacity=".6" transform="rotate(-32 ${80-r*.38} ${86-r*.42})"/>
    <circle cx="${80+r*.42}" cy="${86-r*.5}" r="${r*.06}" fill="#fff" opacity=".7"/>
    ${[0.4,1.3,2.4,3.6,4.7,5.6].map((a,i)=>crack(a+i*.2,8+p*10)).join("")}
    ${sleep?`<path d="M64 ${eyeY} q6 4 12 0 M84 ${eyeY} q6 4 12 0" stroke="#0b2b40" stroke-width="3" fill="none" stroke-linecap="round"/>`
      :happy?`<path d="M64 ${eyeY+2} q6 -6 12 0 M84 ${eyeY+2} q6 -6 12 0" stroke="#0b2b40" stroke-width="3" fill="none" stroke-linecap="round"/>`
      :`<circle cx="70" cy="${eyeY}" r="${4+p*2}" fill="#0b2b40"/><circle cx="90" cy="${eyeY}" r="${4+p*2}" fill="#0b2b40"/><circle cx="71.5" cy="${eyeY-1.5}" r="1.4" fill="#fff"/><circle cx="91.5" cy="${eyeY-1.5}" r="1.4" fill="#fff"/>
        ${worry?`<path d="M62 ${eyeY-10} l12 4 M98 ${eyeY-10} l-12 4" stroke="#0b2b40" stroke-width="2.4" stroke-linecap="round"/>`:""}`}
    <ellipse cx="62" cy="${eyeY+11}" rx="7" ry="4" fill="#ff5d7a" opacity="${cheek*.8}"/><ellipse cx="98" cy="${eyeY+11}" rx="7" ry="4" fill="#ff5d7a" opacity="${cheek*.8}"/>
    ${sleep?`<path d="M74 ${eyeY+14} q6 3 12 0" stroke="#0b2b40" stroke-width="2.4" fill="none" stroke-linecap="round"/>`
      :p>.7?`<ellipse cx="80" cy="${eyeY+16}" rx="${5+p*3}" ry="${3+p*4}" fill="#0b2b40"/>`:`<path d="M72 ${eyeY+13} q8 ${happy?9:6} 16 0" stroke="#0b2b40" stroke-width="2.6" fill="none" stroke-linecap="round"/>`}
    ${sweat?`<path d="M${80+r*.7} ${86-r*.35} q4 7 0 10 q-4 -3 0 -10z" fill="#bff3ff" opacity="${cheek}"/>`:""}
    ${sleep?`<text x="112" y="44" font-size="14" fill="#bff3ff" opacity=".8" font-family="monospace">z z z</text>`:""}
  </svg>`; }

let BB=null, bbTimer=null, bbAnim=null, bbEvSeen=0, bbMe="", bbLocalTyping="";
function bbNewState(players,settings,net){ return {net:!!net,set:{...settings},phase:"ready",round:0,cat:0,turn:0,q:null,qText:"",used:[],answers:[],
  players:players.map((p,i)=>({id:p.id||("p"+i),n:p.n,bot:!!p.bot,local:!!p.local,lives:settings.lives,pts:0,segs:[],ans:0,rare:0,out:false,gone:false,last:null,typing:""})),
  catStart:0,fuseAt:0,turnStart:0,pressure:0,ev:[],evn:0,countdown:3,winner:null}; }
function bbEv(e){ BB.evn++; e.id=BB.evn; BB.ev.push(e); if(BB.ev.length>20) BB.ev.shift(); }
function bbAlive(){ return BB.players.filter(p=>!p.out); }
function bbCur(){ return BB.players[BB.turn]; }
function bbNextTurn(from){ const n=BB.players.length; let i=from; for(let k=0;k<n;k++){ i=(i+1)%n; if(!BB.players[i].out) return i; } return from; }

async function bbStart(players,settings,net){
  clearInterval(bbTimer); BB=bbNewState(players,settings,net); BB._seen=new Set(); bbEvSeen=0;
  BB._next=partyPick(BB._seen);
  bbRenderArena(); bbEv({k:"ready"}); bbSync();
  for(let n=3;n>=1;n--){ BB.countdown=n; bbEv({k:"count",n}); bbSync(); await new Promise(r=>setTimeout(r,800)); if(!BB) return; }
  BB.countdown=0; bbEv({k:"count",n:0}); BB.turn=Math.floor(Math.random()*BB.players.length); await bbNewCategory();
  bbTimer=setInterval(bbTick,100); }
async function bbNewCategory(){ const mine=BB; const q=await (BB._next||partyPick(BB._seen)); if(BB!==mine) return;
  BB._seen.add(q.id); BB._next=partyPick(BB._seen); parse(q);
  BB.q=q; BB.qText=q.q; BB.cat++; BB.used=[]; BB.answers=[]; BB.players.forEach(p=>{p.last=null;p.typing="";});
  const now=Date.now(), fuse=(14+Math.random()*26)*1000;           // skjult lunte: 14–40 s per kategori
  BB.catStart=now; BB.fuseAt=now+fuse; BB.turnStart=now; BB.phase="play"; BB.pressure=0;
  if(bbCur().out) BB.turn=bbNextTurn(BB.turn);
  bbEv({k:"cat",n:BB.cat}); bbTurnStart(); bbSync(); }
function bbTurnStart(){ BB.turnStart=Date.now(); const cur=bbCur(); cur.typing=""; bbEv({k:"turn",id:cur.id}); if(cur.bot) bbBotPlay(); }
function bbTick(){ if(!BB||BB.phase!=="play") return; const now=Date.now();
  BB.pressure=Math.min(1,(now-BB.catStart)/(BB.fuseAt-BB.catStart));
  const minLeft=BB.set.minTurn*1000-(now-BB.turnStart);
  if(now>=BB.fuseAt&&minLeft<=0) return bbPop();
  if(now>=BB.fuseAt) BB.pressure=1;
  bbSync(true); }
function bbPop(){ const cur=bbCur(); BB.phase="pop"; cur.lives--; cur.typing=""; if(cur.lives<=0) cur.out=true;
  bbEv({k:"pop",id:cur.id,out:cur.out}); bbSync();
  setTimeout(async()=>{ if(!BB) return; const alive=bbAlive();
    if(alive.length<=1){ BB.phase="end"; BB.winner=alive[0]?alive[0].id:null; bbEv({k:"end",id:BB.winner}); bbSync(); clearInterval(bbTimer); return; }
    BB.turn=bbNextTurn(BB.turn); await bbNewCategory(); },2200); }
// Et svar fra en spiller. «from» er spillerens id (for online og boter).
function bbSubmit(v,from){ if(!BB||BB.phase!=="play") return; v=String(v||"").trim().slice(0,60); if(!v) return;
  const cur=bbCur(); if(from!==cur.id) return;
  const r=check(BB.q,v), say=m=>{ cur.last={bad:true,msg:m,label:v}; bbEv({k:"bad",id:cur.id,msg:m}); bbSync(); };
  if(!r) return say(`«${v}» ble ikke godkjent`);
  // Små skrivefeil (én bokstav i et langt ord) godtas direkte – her går det fort. Ellers: «Mente du …?», og Enter én gang til bekrefter.
  if(!r.exact&&SET.corr!==false&&!autoOK(r,v)){
    const key=norm(v); if(cur._pend!==key){ cur._pend=key; cur.last={bad:true,sug:true,msg:`Mente du «${r.a.label}»? Trykk Enter igjen`,label:v}; bbEv({k:"sug",id:cur.id}); bbSync(); return; } }
  cur._pend=null;
  if(BB.used.includes(r.a.label)) return say(`«${r.a.label}» er allerede sagt`);
  const t=r.a.tier; BB.used.push(r.a.label); BB.answers.push([r.a.label,t,cur.n]);
  cur.last={label:r.a.label,tier:t}; cur.typing=""; cur.ans++; if(t>=4) cur.rare++;
  cur.pts+=TIERS[t].pts; cur.segs.push(t); if(cur.segs.length>12) cur.segs.shift();
  let gained=false; while(cur.pts>=BB.set.pph){ if(cur.lives<BB.set.cap){ cur.lives++; cur.pts-=BB.set.pph; gained=true; cur.segs=[]; } else { cur.pts=BB.set.pph; break; } }
  BB.fuseAt+= [0,400,800,1300,1900,2600][t];                       // sjeldne svar slipper ut litt luft
  bbEv({k:"ok",id:cur.id,label:r.a.label,tier:t}); if(gained) bbEv({k:"plus",id:cur.id});
  BB.turn=bbNextTurn(BB.turn); bbTurnStart(); bbSync(); }
function bbTyping(v,from){ if(!BB||BB.phase!=="play") return; const cur=bbCur(); if(from!==cur.id) return; cur.typing=String(v||"").slice(0,40); bbSync(true); }
function bbBotPlay(){ const r0=BB.cat, id=bbCur().id, all=parse(BB.q).filter(a=>!BB.used.includes(a.label));
  const fail=Math.random()<.08||!all.length; const w=all.map(a=>Math.pow(.45,a.tier)); let x=Math.random()*w.reduce((s,v)=>s+v,0), pick=all[0];
  for(let i=0;i<all.length;i++){ x-=w[i]; if(x<=0){ pick=all[i]; break; } }
  const word=pick?pick.label:"", think=900+Math.random()*2600; let i=0;
  const step=()=>{ if(!BB||BB.cat!==r0||bbCur().id!==id||BB.phase!=="play") return;
    if(fail) return;                                                // boten står fast av og til
    i++; bbTyping(word.slice(0,i),id); if(i<word.length) setTimeout(step,70+Math.random()*90); else setTimeout(()=>bbSubmit(word,id),250); };
  setTimeout(step,think); }

/* ----- Synk til gjester og tegning ----- */
let bbSyncT=0;
function bbPublic(){ return {set:BB.set,phase:BB.phase,cat:BB.cat,turn:BB.turn,qText:BB.qText,answers:BB.answers.slice(-30),pressure:BB.pressure,countdown:BB.countdown,winner:BB.winner,
  minLeft:Math.max(0,BB.set.minTurn*1000-(Date.now()-BB.turnStart)),ev:BB.ev,evn:BB.evn,
  players:BB.players.map(p=>({id:p.id,n:p.n,bot:p.bot,local:p.local,lives:p.lives,pts:p.pts,segs:p.segs,ans:p.ans,rare:p.rare,out:p.out,gone:p.gone,last:p.last,typing:p.typing}))}; }
function bbSync(light){ if(!BB) return; const s=bbPublic(); bbDraw(s);
  if(BB.net&&NET.peer){ const now=Date.now(); if(!light||now-bbSyncT>140){ bbSyncT=now; NET.all({t:"bb",s}); } } }
