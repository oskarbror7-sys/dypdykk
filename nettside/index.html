function bbSeatPos(i,n){ const a=Math.PI/2+i*2*Math.PI/n, m=innerWidth<640; return {x:50+Math.cos(a)*(m?38:40), y:(m?60:57)+Math.sin(a)*(m?27:31)}; }   // prosent; spiller 0 nederst
function bbAvatar(p,i){ const b=BUDDIES[i%BUDDIES.length]; return p.bot?ICONS[(i+2)%6]:b.art(); }
let bbLast=null; const bbChg={};
// Svarboblen «popper inn» i 350 ms når et nytt svar kommer
function bbChanged(pl){ const key=pl.last?pl.last.label+"|"+pl.last.tier:""; const c=bbChg[pl.id]; if(!c||c.key!==key){ bbChg[pl.id]={key,t:Date.now()}; return !!key&&!!c; } return Date.now()-c.t<350; }
function bbRenderArena(){
  $("page").innerHTML=`<div class="pg" style="max-width:1000px;padding-bottom:150px"><button class="back" id="bbQuit">← Avslutt Boblebomben</button>
    <div class="bbarena" id="bbArena"><div class="bbring"></div><div class="bbcat" id="bbCat" style="display:none"></div><div id="bbSeats"></div>
      <div class="bbbubble" id="bbBubble"></div><div id="bbFx"></div><div class="bbcount" id="bbCount" style="display:none"></div><div class="bbwin" id="bbWin" style="display:none"></div></div>
    <div id="bbAfter"></div></div>
    <div class="bbvig" id="bbVig"></div>
    <div class="bbbar" id="bbBar"><div class="bbhint" id="bbHint"></div><div class="in"><div class="bbheart" id="bbHeart"></div>
      <form id="bbForm" autocomplete="off"><input id="bbInp" placeholder="Vent på boblen …" autocapitalize="off" spellcheck="false" disabled><button id="bbGo">SEND</button></form></div>
      <div class="bbtime"><i id="bbTime" style="width:0"></i></div></div>`;
  bbLast=null;
  $("bbQuit").onclick=()=>{ bbStop(true); location.hash="boblebomben"; route(); };
  const inp=$("bbInp");
  inp.oninput=()=>{ BBS.type(); bbLocalTyping=inp.value; bbSendTyping(inp.value); };
  $("bbForm").onsubmit=e=>{ e.preventDefault(); const v=inp.value.trim(); if(!v) return; bbSendAnswer(v); };
}
function bbMeIds(s){ if(BB&&!BB.net) return s.players.filter(p=>p.local).map(p=>p.id); return [bbMe]; }
function bbSendAnswer(v){ const s=bbLast; if(!s) return; const cur=s.players[s.turn]; if(!bbMeIds(s).includes(cur.id)) return;
  if(BB) bbSubmit(v,cur.id); else if(NET.hostConn) NET.hostConn.send({t:"ans",v}); }
let bbTypT=0;
function bbSendTyping(v){ const s=bbLast; if(!s) return; const cur=s.players[s.turn]; if(!bbMeIds(s).includes(cur.id)) return;
  if(BB) bbTyping(v,cur.id); else if(NET.hostConn&&Date.now()-bbTypT>90){ bbTypT=Date.now(); NET.hostConn.send({t:"typ",v}); } }

function bbFxAt(id,html,cls,ms){ const seat=document.querySelector(`[data-pid="${CSS.escape(id)}"]`), fxl=$("bbFx"); if(!seat||!fxl) return;
  const el=document.createElement("div"); el.className=cls; el.innerHTML=html; el.style.left=seat.style.left; el.style.top=seat.style.top; fxl.appendChild(el); setTimeout(()=>el.remove(),ms||1200); return el; }
function bbShards(){ const b=$("bbBubble"), fxl=$("bbFx"); if(!b||!fxl) return; const x=b.style.left, y=b.style.top;
  for(let i=0;i<22;i++){ const s=document.createElement("div"); s.className="bbshard"; s.style.left=x; s.style.top=y; s.style.background=["#ffd36b","#bff3ff","#ff5d7a","#5ef2d6"][i%4]; fxl.appendChild(s);
    const a=i/22*Math.PI*2, d=90+Math.random()*90; s.animate([{transform:`translate(-50%,-50%) rotate(${a}rad)`,opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) rotate(${a+3}rad)`,opacity:0}],{duration:900+Math.random()*400,easing:"cubic-bezier(.1,.8,.3,1)"}); setTimeout(()=>s.remove(),1400); } }
function bbEffects(s){ for(const e of s.ev){ if(e.id<=bbEvSeen) continue; bbEvSeen=e.id;
    if(e.k==="count"){ BBS.count(e.n); }
    else if(e.k==="cat"){ SFX.go(); const c=$("bbCat"); if(c) c.animate([{transform:"translateX(-50%) translateY(-20px)",opacity:0},{transform:"translateX(-50%)",opacity:1}],{duration:450,easing:"ease-out"}); }
    else if(e.k==="ok"){ BBS.ok(e.tier); if(bbMeIds(s).includes(e.id)){ const i=$("bbInp"); if(i){ i.value=""; bbLocalTyping=""; } } if(e.tier>=4){ fx.flash(TIERS[e.tier].color,.18,450); } }
    else if(e.k==="bad"){ if(bbMeIds(s).includes(e.id)){ BBS.bad(); const f=$("bbForm"); if(f) f.animate([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(-5px)"},{transform:"none"}],{duration:300}); const i=$("bbInp"); if(i){ i.value=""; bbLocalTyping=""; } } }
    else if(e.k==="pop"){ BBS.pop(); fx.flash("#ff5d7a",.55,700); fx.shake(16,650); bbShards(); bbFxAt(e.id,"−1 ♥","bbplus",1400)?.animate([{transform:"translate(-50%,-60px)",opacity:1},{transform:"translate(-50%,-110px)",opacity:0}],{duration:1400}); }
    else if(e.k==="plus"){ BBS.plus(); const el=bbFxAt(e.id,"+1 ♥","bbplus",1400); el&&el.animate([{transform:"translate(-50%,-60px) scale(.6)",opacity:0},{transform:"translate(-50%,-90px) scale(1.3)",opacity:1},{transform:"translate(-50%,-130px)",opacity:0}],{duration:1400}); }
    else if(e.k==="sug"){ if(bbMeIds(s).includes(e.id)) SFX.count(); }
    else if(e.k==="turn"){ if(bbMeIds(s).includes(e.id)){ SFX.bubble(); const i=$("bbInp"); if(i){ i.value=""; bbLocalTyping=""; setTimeout(()=>i.focus(),30); } } }
    else if(e.k==="end"){ BBS.win(); } } }
function bbDraw(s){ if(!$("bbArena")) bbRenderArena(); const prev=bbLast; bbLast=s;
  const n=s.players.length, cur=s.players[s.turn], meIds=bbMeIds(s), mine=s.phase==="play"&&meIds.includes(cur.id), p=s.pressure, danger=s.phase==="play"&&p>.68;
  // sitteplasser
  const seats=$("bbSeats"); if(!prev||prev.players.length!==n) seats.innerHTML=s.players.map((pl,i)=>{ const pos=bbSeatPos(i,n); return `<div class="bbseat" data-pid="${esc(pl.id)}" style="left:${pos.x}%;top:${pos.y}%"></div>`; }).join("");
  s.players.forEach((pl,i)=>{ const el=seats.children[i]; if(!el) return; const isCur=s.phase==="play"&&i===s.turn;
    el.className="bbseat"+(isCur?" cur":"")+(pl.out?" out":"");
    const hearts="♥".repeat(Math.max(0,pl.lives))+`<span class="e">${"♥".repeat(Math.max(0,Math.min(s.set.cap,Math.max(pl.lives,s.set.lives))-pl.lives))}</span>`;
    const sum=pl.segs.reduce((a,t)=>a+TIERS[t].pts,0)||1, frac=Math.min(1,pl.pts/s.set.pph);
    const prog=pl.segs.map(t=>`<i style="width:${TIERS[t].pts/sum*frac*100}%;background:${TIERS[t].color}"></i>`).join("");
    const pos=bbSeatPos(i,n), low=pos.y>75;   // nederste plass: svarboblen ved siden av, ellers under steinen
    const off=low?18:132, side=low?(innerWidth<640?"left:calc(100% + 34px)":"left:calc(100% + 70px)"):"";
    let say="";
    if(isCur&&pl.typing) say=`<div class="bbsay typ" style="top:${off}px;${side}">${esc(pl.typing)}</div>`;
    else if(pl.last&&!pl.last.bad) say=`<div class="bbsay${bbChanged(pl)?" pop":""}" style="top:${off}px;${side};color:${TIERS[pl.last.tier].color};border-color:${TIERS[pl.last.tier].color}66"><span class="tl" style="color:${TIERS[pl.last.tier].color}">▸ ${TIERS[pl.last.tier].name.toUpperCase()}</span>${esc(pl.last.label)}</div>`;
    const bad=pl.last&&pl.last.bad&&isCur?`<div class="bbbad" style="top:${off+34}px;${side}${pl.last.sug?";color:#5ef2d6":""}">${esc(pl.last.msg)}</div>`:"";
    el.innerHTML=`<div class="av">${bbAvatar(pl,i)}</div><div class="rock"></div><div class="nm">${pl.bot?"🤖 ":""}${esc(pl.n)}${(!BB||BB.net)&&meIds.includes(pl.id)?" (deg)":""}</div><div class="hp">${pl.gone?'<span class="e">frakoblet</span>':hearts}</div><div class="prog">${prog}</div>${say}${bad}`; });
  // kategori
  const cat=$("bbCat"); if(s.cat&&s.phase!=="end"){ cat.style.display=""; cat.innerHTML=`<small>KATEGORI ${s.cat}</small><b>${esc(s.qText)}</b><i>▼ alle godkjente svar sender boblen videre ▼</i>`; } else cat.style.display="none";
  // boblen: svømmer mot den som har tur
  const bub=$("bbBubble"), tgt=s.phase==="end"&&s.winner?s.players.findIndex(x=>x.id===s.winner):s.turn, tp=bbSeatPos(Math.max(0,tgt),n);
  const cy=innerWidth<640?60:57, bx=s.phase==="ready"?50:50+(tp.x-50)*.3, by=s.phase==="ready"?cy:cy+(tp.y-cy)*.3;
  bub.style.left=bx+"%"; bub.style.top=by+"%";
  const mood=s.phase==="ready"?"sleep":s.phase==="end"?"happy":"";
  bub.style.display=s.phase==="pop"?"none":"";
  bub.innerHTML=bbBubbleSVG(s.phase==="play"?p:.05,mood);
  if(s.phase==="play"){ const wob=p>.5?(p-.5)*14:0; bub.style.transform=`translate(-50%,-50%) rotate(${Math.sin(Date.now()/(120-p*70))*wob}deg) scale(${1+Math.sin(Date.now()/90)*p*.03})`; } else bub.style.transform="translate(-50%,-50%)";
  // nedtelling og vinner
  const cd=$("bbCount"); if(s.phase==="ready"&&s.countdown>0){ cd.style.display=""; if(!prev||prev.countdown!==s.countdown){ cd.innerHTML=`${s.countdown}<small>GJØR DEG KLAR</small>`; cd.animate([{transform:"translate(-50%,-50%) scale(1.8)",opacity:0},{transform:"translate(-50%,-50%) scale(1)",opacity:1}],{duration:300,easing:"ease-out"}); } } else cd.style.display="none";
  const win=$("bbWin"); if(s.phase==="end"){ const w=s.players.find(x=>x.id===s.winner); win.style.display=""; win.innerHTML=`<b>${esc(w?w.n.toUpperCase():"INGEN")}</b><span>${w&&meIds.includes(w.id)&&(BB?BB.net:true)?"DU VANT RUNDEN!":"VINNER RUNDEN"}</span>`; if(!prev||prev.phase!=="end") bbAfter(s); } else { win.style.display="none"; if($("bbAfter").innerHTML) $("bbAfter").innerHTML=""; }
  // tidsfølelse: rød kant, puls og hjerteslag i faresonen
  const vig=$("bbVig"); vig.style.opacity=danger?Math.min(1,(p-.68)/.32)*(.55+.45*Math.abs(Math.sin(Date.now()/(260-p*140)))):0;
  const bar=$("bbBar"); bar.classList.toggle("danger",danger); bar.style.display=s.phase==="end"?"none":"";
  $("bbTime").style.width=(s.phase==="play"?p*100:0)+"%";
  if(s.phase==="play"){ const now=Date.now(); const beat=danger?Math.max(220,700-(p-.68)*1400):0;
    if(beat&&(!bbDraw._hb||now-bbDraw._hb>beat)){ bbDraw._hb=now; BBS.heart(p); }
    if(!bbDraw._inf||now-bbDraw._inf>1300-p*800){ bbDraw._inf=now; if(p>.2) BBS.inflate(p); } }
  // inndata
  const inp=$("bbInp"), hint=$("bbHint"), me=s.players.find(x=>meIds.includes(x.id)&&(BB&&!BB.net?x.id===cur.id:true))||s.players.find(x=>meIds.includes(x.id));
  inp.disabled=!mine; $("bbGo").disabled=!mine;
  if(mine&&document.activeElement!==inp) inp.focus();
  inp.placeholder=s.phase==="ready"?"Vent på boblen …":mine?"Din tur – skriv!":`${cur.n} har boblen …`;
  hint.innerHTML=s.phase!=="play"?"&nbsp;":mine?`<b>▸ ${BB&&!BB.net&&meIds.length>1?esc(cur.n)+", din tur":"Din tur"}</b> · skriv et svar${danger?" – <b>FORT!</b>":""}`:`▸ <b>${esc(cur.n)}</b> har boblen`;
  if(me){ const fr=Math.min(1,me.pts/s.set.pph), C=2*Math.PI*22; $("bbHeart").innerHTML=`<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="rgba(6,24,40,.9)" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle cx="26" cy="26" r="22" fill="none" stroke="#ff5d7a" stroke-width="4" stroke-dasharray="${C*fr} ${C}" stroke-linecap="round"/></svg><b>♥${me.lives}</b>`; }
  bbEffects(s); }
function bbAfter(s){ const ps=[...s.players].sort((a,b)=>(b.out?0:1)-(a.out?0:1)||b.lives-a.lives||b.ans-a.ans), host=!!BB;
  $("bbAfter").innerHTML=`<div class="panel glass" style="text-align:left;max-width:560px;margin:0 auto 12px"><h3>Resultat</h3><ul class="lb">${ps.map((p,i)=>`<li><span class="pos">${i+1}</span><span class="nm">${esc(p.n)}</span><span class="sc">${p.ans} svar</span><span class="sc" style="color:#ffd36b">${p.rare} sjeldne</span></li>`).join("")}</ul></div>
   <div style="text-align:center"><div class="sect">Hvordan var runden?</div><div class="bbrate">${[1,2,3,4,5].map(n=>`<button data-r="${n}">${n}</button>`).join("")}</div><small style="color:var(--muted)">1 · kjedelig &nbsp; 5 · kjempegøy</small></div>
   <div class="btnrow" style="margin-top:14px">${host?`<button class="btn btn-primary" id="bbAgain">Spill igjen</button>`:`<span class="psub">Venter på at verten starter neste runde …</span>`}<button class="btn btn-ghost" id="bbLobby">${host&&BB.net?"Til lobbyen":host?"Til oppsett":"Forlat"}</button></div>`;
  $("bbAfter").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{ $("bbAfter").querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===b)); const l=store.get("dypdykk-boble-vurdering")||[]; l.push({r:+b.dataset.r,d:todayKey()}); store.set("dypdykk-boble-vurdering",l.slice(-50)); toast("Takk!"); });
  if($("bbAgain")) $("bbAgain").onclick=()=>{ const pl=BB.players.filter(p=>!p.gone).map(p=>({id:p.id,n:p.n,bot:p.bot,local:p.local})), set=BB.set, net=BB.net; bbStart(pl,set,net); };
  $("bbLobby").onclick=()=>{ if(BB&&BB.net){ bbStop(false); netLobbySync(); netLobbyRender(); } else { bbStop(true); route(); } }; }
function bbStop(closeNet){ clearInterval(bbTimer); bbTimer=null; cancelAnimationFrame(bbAnim); if(closeNet&&(BB&&BB.net||!BB)&&NET.peer) NET.close(); BB=null; bbLast=null; const v=$("bbVig"); if(v) v.remove(); }
// jevn animasjon av boblen (pressure tegnes ~25 fps også mellom synker)
function bbLoop(){ bbAnim=requestAnimationFrame(bbLoop); if(!bbLast||!$("bbArena")) return; const now=performance.now(); if(bbLoop._t&&now-bbLoop._t<40) return; bbLoop._t=now;
  if(bbLast.phase==="play"){ const bub=$("bbBubble"); if(bub){ const p=bbLast.pressure, wob=p>.5?(p-.5)*14:0; bub.style.transform=`translate(-50%,-50%) rotate(${Math.sin(Date.now()/(120-p*70))*wob}deg) scale(${1+Math.sin(Date.now()/90)*p*.03})`; }
    const vig=$("bbVig"); if(vig&&bbLast.pressure>.68) vig.style.opacity=Math.min(1,(bbLast.pressure-.68)/.32)*(.55+.45*Math.abs(Math.sin(Date.now()/(260-bbLast.pressure*140)))); } }

/* ----- Oppsettsiden ----- */
function bbStepper(k,v){ const [lo,hi,st]=BB_LIM[k]; const show=k==="minTurn"?v+" s":v;
  return `<div class="row"><div><b>${BB_LBL[k]}</b><small>${BB_HELP[k]}</small></div><div class="bbstep"><button data-k="${k}" data-d="-1" ${v<=lo?"disabled":""} aria-label="Færre ${BB_LBL[k].toLowerCase()}">◀</button><b>${show}</b><button data-k="${k}" data-d="1" ${v>=hi?"disabled":""} aria-label="Flere ${BB_LBL[k].toLowerCase()}">▶</button></div></div>`; }
function bbSettingsPanel(s,keys){ return `<div class="bbsettings">${keys.map(k=>bbStepper(k,s[k])).join("")}</div>`; }
function bbBindSteppers(root,s,after){ root.querySelectorAll(".bbstep button").forEach(b=>b.onclick=()=>{ const k=b.dataset.k, [lo,hi,st]=BB_LIM[k];
  s[k]=Math.max(lo,Math.min(hi,s[k]+(+b.dataset.d)*st)); if(k==="cap"&&s.lives>s.cap) s.lives=s.cap; if(k==="lives"&&s.lives>s.cap) s.cap=s.lives;
  bbSaveSettings(s); SFX.count(); after(); }); }

PAGES.boblebomben=()=>{ const names=store.get("dypdykk-party-names")||[myName()||"Spiller 1"], s=bbSettings();
  return head("Boblebomben","Send boblen videre før den sprekker! Svar på kategorien, så går boblen til neste. Sjeldne svar slipper ut luft og fyller opp et ekstra hjerte.")+
   `<div class="party">${typeof onlinePanel==="function"?onlinePanel():""}
     <div class="panel glass"><h3>Spill på denne enheten</h3><div class="bomb" style="height:120px">${bbBubbleSVG(.15,"sleep")}</div>
       <div id="pNames">${names.map((n,i)=>`<div class="rowf" style="margin-bottom:8px"><input class="field pn" maxlength="16" value="${esc(n)}" placeholder="Navn"><button class="btn btn-ghost pdel" style="padding:10px 14px" data-i="${i}">✕</button></div>`).join("")}</div>
       <button class="btn btn-ghost" id="pAdd" style="width:100%">+ Legg til spiller</button>
       <button class="btn btn-primary" id="pStart" style="width:100%;margin-top:12px">Vekk boblen</button></div>
     <div class="panel glass"><h3>Regler for rommet</h3><div id="bbSet">${bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"])}</div></div>
     <div class="panel glass full"><h3>Slik spiller du</h3><ol class="steps">
       <li>Alle får samme kategori. Den som har boblen, skriver et svar som ikke er sagt før i kategorien.</li>
       <li>Boblen blåses opp hele tiden og sprekker på et skjult tidspunkt. Når den blir rød og skjermkanten pulserer, haster det.</li>
       <li>Et godkjent svar sender boblen videre. Sjeldne svar gir mer poeng – nok poeng gir et ekstra hjerte – og slipper ut litt luft.</li>
       <li>Sprekker boblen hos deg, mister du et hjerte, og det kommer en ny kategori. Sist igjen med hjerter vinner.</li></ol></div></div></div>`; };
PAGE_INIT.boblebomben=()=>{
  const save=()=>store.set("dypdykk-party-names",[...document.querySelectorAll(".pn")].map(i=>i.value.trim()).filter(Boolean));
  if(typeof onlineInit==="function") onlineInit();
  const s=bbSettings(); const rebind=()=>{ $("bbSet").innerHTML=bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"]); bbBindSteppers($("bbSet"),s,rebind); }; bbBindSteppers($("bbSet"),s,rebind);
  $("pAdd").onclick=()=>{ save(); const l=store.get("dypdykk-party-names")||[]; if(l.length>=bbSettings().seats){toast("Rommet har "+bbSettings().seats+" plasser");return;} l.push("Spiller "+(l.length+1)); store.set("dypdykk-party-names",l); route(); };
  document.querySelectorAll(".pdel").forEach(b=>b.onclick=()=>{ save(); const l=store.get("dypdykk-party-names")||[]; l.splice(+b.dataset.i,1); store.set("dypdykk-party-names",l); route(); });
  $("pStart").onclick=async()=>{ save(); const st=bbSettings(), names=(store.get("dypdykk-party-names")||[]).slice(0,st.seats);
    const players=[...names.map((n,i)=>({id:"l"+i,n,local:true})),...Array.from({length:Math.max(0,Math.min(st.bots,st.seats-names.length))},(_,i)=>({id:"b"+i,n:"Dykkebot "+(i+1),bot:true}))];
    if(players.length<2){ toast("Dere må være minst to (legg til en datamotstander)"); return; }
    if(players.every(p=>p.bot)){ toast("Minst én spiller må være et menneske"); return; }
    $("pStart").disabled=true; $("pStart").textContent="Laster …"; ac(); await datasetsReady; bbMe=""; bbStart(players,st,false); bbLoop(); }; };

/* ----- Online: verten kjører motoren, gjestene får tilstanden ----- */
const _netHostData=netHostData;
netHostData=function(id,d){ if(!d||typeof d!=="object") return;
  if(d.t==="ans"&&BB&&BB.net) return bbSubmit(String(d.v||"").slice(0,60),id);
  if(d.t==="typ"&&BB&&BB.net) return bbTyping(String(d.v||"").slice(0,40),id); };
const _netGone=netGone;
netGone=function(id){ if(BB&&BB.net){ if(!NET.conns.has(id)) return; NET.conns.delete(id); const i=NET.lobby.findIndex(p=>p.id===id); if(i>=0) NET.lobby.splice(i,1);
    const p=BB.players.find(x=>x.id===id); if(p&&!p.out){ p.gone=true; p.out=true; p.lives=0; toast(`${p.n} forlot spillet`); const alive=bbAlive();
      if(alive.length<=1&&BB.phase!=="end"){ BB.phase="end"; BB.winner=alive[0]?alive[0].id:null; bbEv({k:"end",id:BB.winner}); clearInterval(bbTimer); }
      else if(BB.players[BB.turn]===p&&BB.phase==="play"){ BB.turn=bbNextTurn(BB.turn); bbTurnStart(); } bbSync(); } return; }
  return _netGone(id); };
// Lobbyen får innstillingene fra Krillion-oppsettet
const _netLobbyRender=netLobbyRender;
netLobbyRender=function(){ if(BB) return; const s=bbSettings(); PARTY.bots=s.bots; PARTY.lives=s.lives; _netLobbyRender(); const lob=$("netLobby"); if(!lob) return;
  const panels=lob.querySelectorAll(".panel"); const setPanel=panels[1]; if(setPanel){ setPanel.innerHTML=`<h3>Regler for rommet</h3><div id="bbSet">${bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"])}</div>`;
    const rebind=()=>{ $("bbSet").innerHTML=bbSettingsPanel(s,["lives","minTurn","cap","pph","bots","seats"]); bbBindSteppers($("bbSet"),s,()=>{ rebind(); PARTY.bots=s.bots; PARTY.lives=s.lives; netLobbySync(); }); }; rebind(); }
  const st=$("nlStart"); if(st){ st.textContent="Vekk boblen"; st.onclick=async()=>{ const s2=bbSettings(); const humans=NET.lobby.slice(0,s2.seats);
    const players=[...humans.map(p=>({id:p.id||"host",n:p.n})),...Array.from({length:Math.max(0,Math.min(s2.bots,s2.seats-humans.length))},(_,i)=>({id:"b"+i,n:"Dykkebot "+(i+1),bot:true}))];
    if(players.length<2) return toast("Dere må være minst to (vent på venner eller legg til en datamotstander)");
    st.disabled=true; st.textContent="Laster …"; await datasetsReady; NET.all({t:"start"}); bbMe="host"; bbStart(players,s2,true); bbLoop(); }; } };
const _netLobbySync=netLobbySync;
netLobbySync=function(){ const s=bbSettings(); NET.all({t:"lobby",code:NET.code,players:NET.lobby.map(p=>p.n),lives:s.lives,bots:s.bots,set:s}); if($("netLobby")) netLobbyRender(); };
// Gjesten: tegner tilstanden fra verten
const _netClientData=netClientData;
netClientData=function(d){ if(d&&d.t==="bb"){ bbMe=NET.myId; if(!$("bbArena")){ bbEvSeen=d.s.evn-1; bbRenderArena(); bbLoop(); } bbDraw(d.s); return; }
  if(d&&d.t==="lobby"&&$("bbArena")){ $("page").innerHTML=""; }
  if(d&&d.t==="lobby"){ _netClientData(d); const v=$("netLobby"); if(v&&d.set){ const ps=v.querySelector(".psub:last-child"); if(ps) ps.textContent=`${d.set.lives} liv · minste tur ${d.set.minTurn} s · hjertetak ${d.set.cap} · ${d.set.pph} poeng per hjerte`; } return; }
  return _netClientData(d); };

startScreen(); route();
</script>
